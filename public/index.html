<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllStars — HR Interview</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0d0f14;
      --surface:#141720;
      --surface2:#1b1f2c;
      --surface3:#232840;
      --border:rgba(255,255,255,.07);
      --border2:rgba(255,255,255,.12);
      --accent:#4f6ef7;
      --accent2:#7d95ff;
      --accent-bg:rgba(79,110,247,.12);
      --accent-border:rgba(79,110,247,.32);
      --text:#e8eaf0;
      --text2:#9ba3bd;
      --text3:#58607c;
      --green:#34d399;
      --green-bg:rgba(52,211,153,.10);
      --green-border:rgba(52,211,153,.22);
      --yellow:#fbbf24;
      --yellow-bg:rgba(251,191,36,.10);
      --yellow-border:rgba(251,191,36,.22);
      --red:#f87171;
      --red-bg:rgba(248,113,113,.10);
      --red-border:rgba(248,113,113,.22);
      --shadow:0 10px 40px rgba(0,0,0,.24);
      --fs:14px;
      --fs-sm:12px;
      --fs-xs:11px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Manrope',sans-serif;
      background:var(--bg);
      color:var(--text);
      font-size:var(--fs);
      min-height:100vh;
    }

    .layout{
      display:flex;
      min-height:100vh;
    }

    .sidebar{
      width:230px;
      flex-shrink:0;
      position:fixed;
      left:0;
      top:0;
      bottom:0;
      background:var(--surface);
      border-right:1px solid var(--border);
      padding:1.2rem 0 1.5rem;
      overflow-y:auto;
      z-index:10;
    }

    .sidebar-logo{
      padding:0 1rem 1.15rem;
      border-bottom:1px solid var(--border);
      margin-bottom:.7rem;
    }

    .brand{
      font-size:16px;
      font-weight:800;
      color:var(--text);
    }

    .sub{
      font-size:var(--fs-xs);
      color:var(--text3);
      margin-top:3px;
    }

    .sidebar-section{
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--text3);
      padding:.45rem 1rem .25rem;
    }

    .nav-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 1rem;
      text-decoration:none;
      color:var(--text2);
      font-size:var(--fs-sm);
      border-left:2px solid transparent;
      transition:.15s;
    }

    .nav-item:hover{
      color:var(--text);
      background:rgba(255,255,255,.03);
    }

    .nav-item.active{
      color:var(--accent2);
      border-left-color:var(--accent);
      background:var(--accent-bg);
    }

    .main{
      margin-left:230px;
      width:100%;
      padding:1.6rem 1.6rem 3rem;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:1.2rem;
    }

    .page-title h1{
      font-size:30px;
      font-weight:800;
      line-height:1.12;
      letter-spacing:-.03em;
    }

    .page-title p{
      color:var(--text2);
      margin-top:6px;
      font-size:13px;
    }

    .top-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      border:none;
      cursor:pointer;
      font-family:'Manrope',sans-serif;
      font-weight:700;
      font-size:13px;
      border-radius:12px;
      padding:.78rem 1rem;
      transition:.15s;
    }

    .btn-primary{
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
    }

    .btn-primary:hover{
      background:rgba(79,110,247,.18);
    }

    .btn-ghost{
      background:var(--surface2);
      border:1px solid var(--border);
      color:var(--text2);
    }

    .btn-ghost:hover{
      border-color:var(--border2);
      color:var(--text);
    }

    .hero{
      display:grid;
      grid-template-columns:430px minmax(0,1fr);
      gap:16px;
      align-items:start;
    }

    .left-column{
      display:flex;
      flex-direction:column;
      gap:16px;
      align-self:start;
    }

    .card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .panel{
      padding:1rem;
    }

    .panel-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:.9rem;
    }

    .panel-title h2{
      font-size:17px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .mini-note{
      font-size:12px;
      color:var(--text3);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:4px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
      border:1px solid var(--border2);
      background:var(--surface3);
      color:var(--text2);
      cursor:pointer;
      transition:.14s;
      user-select:none;
    }

    .pill:hover{
      color:var(--text);
      border-color:var(--accent-border);
    }

    .pill.selected{
      background:var(--accent-bg);
      color:var(--accent2);
      border-color:var(--accent-border);
    }

    .pill-group{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .stack{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .field{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.72rem .85rem;
    }

    .field label{
      display:block;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:700;
      color:var(--text3);
      margin-bottom:5px;
    }

    .field input,
    .field textarea,
    .field select{
      width:100%;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      font-family:'Manrope',sans-serif;
    }

    .field textarea{
      resize:vertical;
      min-height:76px;
      line-height:1.6;
    }

    .field input::placeholder,
    .field textarea::placeholder{
      color:var(--text3);
    }

    .grid-2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .grid-3{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
    }

    .script-wrap{
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:0;
    }

    .section{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:16px;
      padding:1rem;
    }

    .section-header{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:.9rem;
    }

    .section-num{
      width:28px;
      height:28px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:800;
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
      flex-shrink:0;
    }

    .section-header h3{
      font-size:17px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .speech{
      background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border:1px solid var(--border2);
      border-left:3px solid var(--accent);
      border-radius:0 12px 12px 0;
      padding:.9rem 1rem;
      line-height:1.7;
      margin-bottom:.8rem;
    }

    .speaker{
      font-size:11px;
      letter-spacing:.07em;
      font-weight:800;
      text-transform:uppercase;
      color:var(--accent2);
      margin-bottom:6px;
    }

    .question{
      padding:.8rem .9rem;
      border:1px solid var(--border);
      border-radius:12px;
      background:var(--surface3);
      margin-bottom:.65rem;
    }

    .q-top{
      display:flex;
      align-items:flex-start;
      gap:9px;
      margin-bottom:6px;
    }

    .q-badge{
      width:22px;
      height:22px;
      border-radius:7px;
      flex-shrink:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:10px;
      font-weight:800;
      color:var(--text2);
      border:1px solid var(--border2);
      background:rgba(255,255,255,.02);
      margin-top:1px;
    }

    .q-text{
      font-weight:700;
      line-height:1.55;
    }

    .q-hint{
      color:var(--text2);
      font-size:12px;
      line-height:1.55;
      padding-left:31px;
    }

    .q-note{
      margin-top:8px;
      width:100%;
      min-height:64px;
      background:rgba(0,0,0,.20);
      border:1px solid var(--border);
      border-radius:10px;
      padding:.65rem;
      color:var(--text);
      font-family:'Manrope',sans-serif;
      font-size:13px;
      line-height:1.55;
      resize:vertical;
    }

    .q-note:focus{
      border-color:var(--accent-border);
      outline:none;
    }

    .q-note::placeholder{
      color:var(--text3);
    }

    .note{
      display:flex;
      gap:8px;
      align-items:flex-start;
      padding:.75rem .9rem;
      background:var(--yellow-bg);
      color:var(--yellow);
      border:1px solid var(--yellow-border);
      border-radius:12px;
      font-size:12px;
      line-height:1.55;
      margin-bottom:.8rem;
    }

    .listen{
      display:flex;
      gap:8px;
      align-items:flex-start;
      padding:.75rem .9rem;
      background:var(--green-bg);
      color:var(--green);
      border:1px solid var(--green-border);
      border-radius:12px;
      font-size:12px;
      line-height:1.55;
      margin-bottom:.7rem;
    }

    .case{
      border-radius:14px;
      border:1px solid var(--red-border);
      background:var(--red-bg);
      padding:.95rem 1rem;
      margin-bottom:.8rem;
    }

    .case-label{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      color:var(--red);
      margin-bottom:7px;
    }

    .case-text{
      line-height:1.65;
      margin-bottom:.45rem;
    }

    .case-hint{
      font-size:12px;
      color:var(--text2);
      line-height:1.55;
      border-top:1px solid var(--red-border);
      padding-top:8px;
    }

    .checklist{
      margin-top:0;
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      padding:1rem;
      box-shadow:var(--shadow);
    }

    .checklist-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:1rem;
    }

    .checklist-top h2{
      font-size:18px;
      font-weight:800;
    }

    .score-box{
      width:100%;
      background:var(--surface3);
      border:1px solid var(--border2);
      border-radius:14px;
      padding:.9rem 1rem;
    }

    .score-label{
      font-size:11px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .score-val{
      font-size:28px;
      font-weight:800;
      margin-top:4px;
    }

    .score-val span{
      font-size:14px;
      font-weight:500;
      color:var(--text2);
    }

    .verdict{
      margin-top:8px;
      font-size:13px;
      font-weight:700;
      padding:.6rem .75rem;
      border-radius:12px;
      display:none;
    }

    .verdict.show{
      display:block;
    }

    .verdict.green{
      background:var(--green-bg);
      border:1px solid var(--green-border);
      color:var(--green);
    }

    .verdict.yellow{
      background:var(--yellow-bg);
      border:1px solid var(--yellow-border);
      color:var(--yellow);
    }

    .verdict.red{
      background:var(--red-bg);
      border:1px solid var(--red-border);
      color:var(--red);
    }

    .criteria-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }

    .criteria-card{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem;
    }

    .criteria-title{
      font-size:11px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      margin-bottom:.75rem;
      padding-bottom:.55rem;
      border-bottom:1px solid var(--border);
    }

    .crit-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:.62rem 0;
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .crit-row:last-child{
      border-bottom:none;
    }

    .crit-label{
      line-height:1.45;
      font-size:13px;
      color:var(--text);
      flex:1;
      padding-right:10px;
    }

    .stars{
      display:flex;
      gap:2px;
      flex-shrink:0;
    }

    .star{
      font-size:18px;
      cursor:pointer;
      color:#31384d;
      transition:.12s;
      user-select:none;
      line-height:1;
    }

    .star.on{
      color:var(--yellow);
    }

    .star:hover{
      transform:scale(1.12);
    }

    .bottom-actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:1rem;
    }

    .sub-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .status-line{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      color:var(--text3);
      font-size:12px;
    }

    .save-btn.saved{
      background:var(--green-bg);
      border:1px solid var(--green-border);
      color:var(--green);
    }

    .save-btn.error{
      background:var(--red-bg);
      border:1px solid var(--red-border);
      color:var(--red);
    }

    @media (max-width:1180px){
      .hero{
        grid-template-columns:1fr;
      }

      .left-column{
        order:1;
      }

      .script-wrap{
        order:2;
      }
    }

    @media (max-width:920px){
      .sidebar{
        display:none;
      }

      .main{
        margin-left:0;
        padding:1rem;
      }

      .grid-2,
      .grid-3{
        grid-template-columns:1fr;
      }
    }
  </style>
