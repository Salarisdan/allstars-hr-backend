<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllStars — Статистика</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{
      --bg:#0d0f14;
      --surface:#141720;
      --surface2:#1b1f2c;
      --surface3:#232840;
      --border:rgba(255,255,255,.07);
      --border2:rgba(255,255,255,.12);
      --accent:#4f6ef7;
      --accent2:#7d95ff;
      --accent-bg:rgba(79,110,247,.12);
      --accent-border:rgba(79,110,247,.32);
      --text:#e8eaf0;
      --text2:#9ba3bd;
      --text3:#58607c;
      --green:#34d399;
      --green-bg:rgba(52,211,153,.10);
      --green-border:rgba(52,211,153,.22);
      --yellow:#fbbf24;
      --yellow-bg:rgba(251,191,36,.10);
      --yellow-border:rgba(251,191,36,.22);
      --red:#f87171;
      --red-bg:rgba(248,113,113,.10);
      --red-border:rgba(248,113,113,.22);
      --purple:#a78bfa;
      --purple-bg:rgba(167,139,250,.10);
      --purple-border:rgba(167,139,250,.22);
      --shadow:0 10px 40px rgba(0,0,0,.24);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:'Manrope',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    .layout{
      display:flex;
      min-height:100vh;
    }

    .sidebar{
      width:230px;
      flex-shrink:0;
      position:fixed;
      left:0;
      top:0;
      bottom:0;
      background:var(--surface);
      border-right:1px solid var(--border);
      padding:1.2rem 0 1.5rem;
      overflow-y:auto;
      z-index:10;
    }

    .sidebar-logo{
      padding:0 1rem 1.15rem;
      border-bottom:1px solid var(--border);
      margin-bottom:.7rem;
    }

    .brand{
      font-size:16px;
      font-weight:800;
      color:var(--text);
    }

    .sub{
      font-size:11px;
      color:var(--text3);
      margin-top:3px;
    }

    .sidebar-section{
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--text3);
      padding:.45rem 1rem .25rem;
    }

    .nav-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 1rem;
      text-decoration:none;
      color:var(--text2);
      font-size:12px;
      border-left:2px solid transparent;
      transition:.15s;
    }

    .nav-item:hover{
      color:var(--text);
      background:rgba(255,255,255,.03);
    }

    .nav-item.active{
      color:var(--accent2);
      border-left-color:var(--accent);
      background:var(--accent-bg);
    }

    .main{
      margin-left:230px;
      width:100%;
      padding:1.6rem 1.6rem 3rem;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:1rem;
    }

    .title h1{
      font-size:30px;
      font-weight:800;
      line-height:1.1;
      letter-spacing:-.03em;
    }

    .title p{
      color:var(--text2);
      margin-top:6px;
      font-size:13px;
    }

    .btns{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      border:none;
      cursor:pointer;
      font-family:'Manrope',sans-serif;
      font-weight:700;
      font-size:13px;
      border-radius:12px;
      padding:.78rem 1rem;
      transition:.15s;
    }

    .btn-primary{
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
    }

    .btn-ghost{
      background:var(--surface2);
      border:1px solid var(--border);
      color:var(--text2);
    }

    .hero-stats{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:18px;
    }

    .stat-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
    }

    .stat-value{
      font-size:30px;
      font-weight:800;
      line-height:1;
    }

    .stat-label{
      margin-top:8px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text3);
      font-weight:800;
    }

    .sections{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-bottom:18px;
    }

    .section-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .section-title{
      font-size:18px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .section-badge{
      font-size:11px;
      font-weight:700;
      padding:5px 9px;
      border-radius:999px;
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
      white-space:nowrap;
    }

    .mini-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .mini-stat{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem;
    }

    .mini-value{
      font-size:24px;
      font-weight:800;
      line-height:1;
    }

    .mini-label{
      margin-top:7px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text3);
      font-weight:800;
    }

    .summary-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
    }

    .summary-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .summary-list{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
    }

    .summary-item{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem .9rem;
    }

    .summary-item .k{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text3);
      font-weight:800;
      margin-bottom:5px;
    }

    .summary-item .v{
      font-size:15px;
      font-weight:700;
    }

    .loading,
    .error-box{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      padding:1.1rem 1rem;
      color:var(--text2);
    }

    .error-box{
      color:var(--red);
      border-color:var(--red-border);
      background:var(--red-bg);
    }

    .dashboard-wrap{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .dashboard-topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
    }

    .dashboard-title{
      font-size:28px;
      font-weight:900;
      color:var(--text);
      line-height:1.1;
    }

    .dashboard-subtitle{
      margin-top:6px;
      color:var(--text2);
      font-size:13px;
    }

    .dashboard-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .dashboard-tab,
    .dashboard-refresh-btn{
      border:none;
      cursor:pointer;
      border-radius:14px;
      padding:.82rem 1rem;
      font-family:'Manrope',sans-serif;
      font-weight:800;
      font-size:12px;
      transition:.18s ease;
    }

    .dashboard-tab{
      background:var(--surface3);
      border:1px solid var(--border);
      color:var(--text2);
    }

    .dashboard-tab.active{
      background:linear-gradient(135deg, rgba(79,110,247,.28), rgba(168,85,247,.18));
      border-color:rgba(79,110,247,.38);
      color:#dbeafe;
      box-shadow:0 0 20px rgba(79,110,247,.14);
    }

    .dashboard-refresh-btn{
      background:linear-gradient(135deg, rgba(34,197,94,.22), rgba(79,110,247,.16));
      border:1px solid rgba(34,197,94,.28);
      color:#dcfce7;
    }

    .dashboard-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:14px;
    }

    .kpi-card{
      position:relative;
      overflow:hidden;
      border-radius:20px;
      padding:18px;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.02),
        0 10px 28px rgba(0,0,0,.34);
    }

    .kpi-card::after{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(120deg, transparent, rgba(255,255,255,.04), transparent);
      pointer-events:none;
    }

    .kpi-blue{
      background:linear-gradient(135deg, rgba(59,130,246,.42), rgba(79,110,247,.18) 60%, #1b1f2c);
      border-color:rgba(59,130,246,.34);
    }

    .kpi-purple{
      background:linear-gradient(135deg, rgba(168,85,247,.42), rgba(124,58,237,.18) 60%, #1b1f2c);
      border-color:rgba(168,85,247,.34);
    }

    .kpi-green{
      background:linear-gradient(135deg, rgba(34,197,94,.40), rgba(16,185,129,.18) 60%, #1b1f2c);
      border-color:rgba(34,197,94,.34);
    }

    .kpi-red{
      background:linear-gradient(135deg, rgba(239,68,68,.42), rgba(127,29,29,.18) 60%, #1b1f2c);
      border-color:rgba(239,68,68,.34);
    }

    .kpi-orange{
      background:linear-gradient(135deg, rgba(245,158,11,.42), rgba(234,179,8,.18) 60%, #1b1f2c);
      border-color:rgba(245,158,11,.34);
    }

    .kpi-burgundy{
      background:linear-gradient(135deg, rgba(127,29,29,.42), rgba(239,68,68,.14) 60%, #1b1f2c);
      border-color:rgba(127,29,29,.34);
    }

    .kpi-label{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:rgba(255,255,255,.72);
      font-weight:800;
      margin-bottom:10px;
    }

    .kpi-value{
      font-size:34px;
      font-weight:900;
      line-height:1;
      color:#fff;
    }

    .kpi-foot{
      margin-top:10px;
      font-size:12px;
      color:rgba(255,255,255,.78);
    }

    .kpi-trend{
      margin-top:12px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 11px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.08);
      color:#fff;
    }

    .kpi-trend.up{
      background:rgba(34,197,94,.14);
      border-color:rgba(34,197,94,.26);
      color:#bbf7d0;
    }

    .kpi-trend.down{
      background:rgba(239,68,68,.14);
      border-color:rgba(239,68,68,.26);
      color:#fecaca;
    }

    .kpi-trend.flat{
      background:rgba(148,163,184,.14);
      border-color:rgba(148,163,184,.22);
      color:#e2e8f0;
    }

    .kpi-trend-arrow{
      font-size:13px;
      font-weight:900;
    }

    .kpi-trend-main{
      font-size:12px;
      font-weight:900;
    }

    .kpi-trend-sub{
      font-size:11px;
      opacity:.85;
    }

    .dashboard-panels{
      display:grid;
      grid-template-columns:1.25fr .75fr;
      gap:16px;
    }

    .dashboard-panel{
      background:linear-gradient(180deg,#232840,#1b1f2c);
      border:1px solid var(--border);
      border-radius:20px;
      padding:16px;
      box-shadow:var(--shadow);
    }

    .panel-title{
      font-size:15px;
      font-weight:800;
      margin-bottom:14px;
      color:var(--text);
    }

    .daily-list{
      display:grid;
      gap:10px;
    }

    .daily-row{
      display:grid;
      grid-template-columns:110px repeat(5,1fr);
      gap:10px;
      align-items:center;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
    }

    .daily-day{
      font-size:12px;
      font-weight:800;
      color:var(--text2);
    }

    .daily-metric{
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .daily-metric-k{
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.06em;
      font-weight:800;
    }

    .daily-metric-v{
      font-size:16px;
      font-weight:800;
      color:var(--text);
    }

    .daily-bar-wrap{
      width:100%;
      height:6px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      overflow:hidden;
      margin-top:4px;
    }

    .daily-bar{
      height:100%;
      border-radius:999px;
    }

    .bar-blue{
      background:linear-gradient(90deg, #60a5fa, #3b82f6);
    }

    .bar-purple{
      background:linear-gradient(90deg, #c084fc, #8b5cf6);
    }

    .bar-green{
      background:linear-gradient(90deg, #4ade80, #22c55e);
    }

    .bar-red{
      background:linear-gradient(90deg, #f87171, #ef4444);
    }

    .bar-orange{
      background:linear-gradient(90deg, #fbbf24, #f59e0b);
    }

    .conversion-list,
    .platform-list,
    .top-people-list{
      display:grid;
      gap:10px;
    }

    .metric-box,
    .person-box{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:12px 14px;
      border-radius:14px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
    }

    .metric-box-k,
    .person-box-k{
      font-size:12px;
      font-weight:700;
      color:var(--text2);
    }

    .metric-box-v,
    .person-box-v{
      font-size:18px;
      font-weight:900;
      color:var(--text);
    }

    .person-box-sub{
      font-size:11px;
      color:var(--text3);
      margin-top:4px;
    }

    .dashboard-panels-bottom{
      display:grid;
      grid-template-columns:.9fr 1.1fr;
      gap:16px;
    }

    .dashboard-live-badge{
      display:inline-flex;
      align-items:center;
      margin-left:10px;
      padding:4px 8px;
      border-radius:999px;
      font-size:10px;
      font-weight:900;
      letter-spacing:.08em;
      background:rgba(34,197,94,.16);
      border:1px solid rgba(34,197,94,.26);
      color:#bbf7d0;
    }

    @media (max-width:1100px){
      .hero-stats{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .sections{
        grid-template-columns:1fr;
      }

      .summary-list{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:920px){
      .sidebar{display:none}
      .main{margin-left:0;padding:1rem}
      .hero-stats,
      .mini-grid,
      .summary-list{
        grid-template-columns:1fr;
      }
    }

    .chart-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
      margin-top:18px;
    }

    .chart-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .chart-wrap{
      position:relative;
      width:100%;
      min-height:360px;
    }

    .details-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
      margin-top:18px;
    }

    .details-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .details-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
    }

    .detail-item{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem;
    }

    .detail-name{
      font-size:13px;
      font-weight:800;
      margin-bottom:8px;
    }

    .detail-meta{
      display:flex;
      flex-direction:column;
      gap:4px;
      color:var(--text2);
      font-size:12px;
    }

    @media (max-width:1100px){
      .details-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width: 980px){
      .dashboard-panels,
      .dashboard-panels-bottom{
        grid-template-columns:1fr;
      }

      .daily-row{
        grid-template-columns:1fr 1fr;
      }
    }

    @media (max-width:920px){
      .details-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="brand">AllStars</div>
        <div class="sub">Статистика</div>
      </div>

      <div class="sidebar-section">Навигация</div>
      <a class="nav-item" href="/index.html">🧑‍💼 Новый кандидат</a>
      <a class="nav-item" href="/candidates.html">👥 Кандидаты</a>
      <a class="nav-item" href="/interviews.html">📞 Собеседования</a>
      <a class="nav-item active" href="/dashboard.html">📊 Dashboard</a>
      <a class="nav-item" href="/team-dashboard.html">🫂 Действующие</a>
      <a class="nav-item" href="/hr-needs.html">🎯 Потребности HR</a>
      <a class="nav-item" href="/team.html">👥 Команда</a>
    </aside>

    <main class="main">
      <div class="dashboard-wrap">
        <div class="dashboard-topbar">
          <div>
            <div class="dashboard-title">Dashboard</div>
            <div class="dashboard-subtitle" id="dashboardRangeLabel">Загружаем период...</div>
          </div>

          <div class="dashboard-actions">
            <button class="dashboard-tab active" id="weekCurrentBtn" type="button" onclick="setDashboardWeek('current')">
              Эта неделя
            </button>
            <button class="dashboard-tab" id="weekPreviousBtn" type="button" onclick="setDashboardWeek('previous')">
              Прошлая неделя
            </button>
            <button class="dashboard-refresh-btn" type="button" onclick="loadDashboardStats()">
              Обновить
            </button>
          </div>
        </div>

        <div id="dashboardContent">
          <div class="loading">Загружаем dashboard...</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const tokenKey = 'allstars_token';
    const token = localStorage.getItem(tokenKey);

    if (!token) {
      location.href = '/login.html';
    }
    function api(path, options = {}) {
      return fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
    }

    let dashboardWeekMode = 'current';
    let dashboardAutoRefreshTimer = null;

    function setDashboardWeek(mode) {
      dashboardWeekMode = mode;
      document.getElementById('weekCurrentBtn')?.classList.toggle('active', mode === 'current');
      document.getElementById('weekPreviousBtn')?.classList.toggle('active', mode === 'previous');
      loadDashboardStats();
    }
    window.setDashboardWeek = setDashboardWeek;

    function getDayShortLabel(dateStr) {
      const d = new Date(`${dateStr}T00:00:00`);
      const labels = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      return labels[d.getDay()] || dateStr;
    }

    function getTrendMeta(trend) {
      const diff = Number(trend?.diff || 0);
      const diffPercent = Number(trend?.diff_percent || 0);

      if (diff > 0) {
        return {
          cls: 'up',
          arrow: '↑',
          text: `+${diff}`,
          sub: `${diffPercent}%`
        };
      }

      if (diff < 0) {
        return {
          cls: 'down',
          arrow: '↓',
          text: `${diff}`,
          sub: `${diffPercent}%`
        };
      }

      return {
        cls: 'flat',
        arrow: '→',
        text: '0',
        sub: 'без изменений'
      };
    }

    function renderKpiCard(title, value, foot, cls, trend) {
      const t = getTrendMeta(trend);

      return `
        <div class="kpi-card ${cls}">
          <div class="kpi-label">${title}</div>
          <div class="kpi-value">${value || 0}</div>
          <div class="kpi-foot">${foot}</div>

          <div class="kpi-trend ${t.cls}">
            <span class="kpi-trend-arrow">${t.arrow}</span>
            <span class="kpi-trend-main">${t.text}</span>
            <span class="kpi-trend-sub">${t.sub}</span>
          </div>
        </div>
      `;
    }

    function getDailyMax(daily, key) {
      return Math.max(1, ...daily.map(day => Number(day[key] || 0)));
    }

    function renderDailyBar(value, max, cls = '') {
      const width = Math.max(6, Math.round((Number(value || 0) / max) * 100));

      return `
        <div class="daily-bar-wrap">
          <div class="daily-bar ${cls}" style="width:${width}%"></div>
        </div>
      `;
    }

    function renderDashboardStats(data) {
      const content = document.getElementById('dashboardContent');
      const rangeLabel = document.getElementById('dashboardRangeLabel');
      if (!content) return;

      const summary = data?.summary || {};
      const platforms = data?.platforms || {};
      const daily = Array.isArray(data?.daily) ? data.daily : [];
      const conversion = data?.conversion || {};
      const range = data?.range || {};
      const prevRange = data?.previous_range || {};
      const topPeople = Array.isArray(data?.top_people) ? data.top_people : [];
      const trends = data?.trends || {};
      const maxLeads = getDailyMax(daily, 'leads');
      const maxInterviews = getDailyMax(daily, 'interviews');
      const maxHired = getDailyMax(daily, 'hired');
      const maxRejected = getDailyMax(daily, 'rejected');

      if (rangeLabel) {
        rangeLabel.innerHTML = `
          ${range.date_from || '—'} → ${range.date_to || '—'} · сравнение с ${prevRange.date_from || '—'} → ${prevRange.date_to || '—'}
          <span class="dashboard-live-badge">LIVE</span>
        `;
      }

      content.innerHTML = `
        <div class="dashboard-grid">
          ${renderKpiCard('Лиды', summary.leads, 'Новых кандидатов за период', 'kpi-blue', trends.leads)}
          ${renderKpiCard('Собеседования', summary.interviews, 'Проведено интервью', 'kpi-purple', trends.interviews)}
          ${renderKpiCard('Принятые', summary.hired, 'Вышли на работу за неделю', 'kpi-green', trends.hired)}
          ${renderKpiCard('Отказы', summary.rejected, 'Отказов за неделю', 'kpi-red', trends.rejected)}
          ${renderKpiCard('Уволены', summary.fired, 'Уволено за неделю', 'kpi-burgundy', trends.fired)}
        </div>

        <div class="dashboard-panels">
          <div class="dashboard-panel">
            <div class="panel-title">Разбивка по дням</div>
            <div class="daily-list">
              ${daily.map(day => `
                <div class="daily-row">
                  <div class="daily-day">${getDayShortLabel(day.date)} · ${day.date}</div>

                  <div class="daily-metric">
                    <div class="daily-metric-k">Лиды</div>
                    <div class="daily-metric-v">${day.leads || 0}</div>
                    ${renderDailyBar(day.leads, maxLeads, 'bar-blue')}
                  </div>

                  <div class="daily-metric">
                    <div class="daily-metric-k">Собесы</div>
                    <div class="daily-metric-v">${day.interviews || 0}</div>
                    ${renderDailyBar(day.interviews, maxInterviews, 'bar-purple')}
                  </div>

                  <div class="daily-metric">
                    <div class="daily-metric-k">Приняты</div>
                    <div class="daily-metric-v">${day.hired || 0}</div>
                    ${renderDailyBar(day.hired, maxHired, 'bar-green')}
                  </div>

                  <div class="daily-metric">
                    <div class="daily-metric-k">Отказы</div>
                    <div class="daily-metric-v">${day.rejected || 0}</div>
                    ${renderDailyBar(day.rejected, maxRejected, 'bar-red')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="dashboard-panel">
            <div class="panel-title">Конверсии</div>

            <div class="conversion-list" style="margin-bottom:14px;">
              <div class="metric-box">
                <div class="metric-box-k">Лид → Собеседование</div>
                <div class="metric-box-v">${conversion.lead_to_interview || 0}%</div>
              </div>

              <div class="metric-box">
                <div class="metric-box-k">Собеседование → Выход на работу</div>
                <div class="metric-box-v">${conversion.interview_to_hired || 0}%</div>
              </div>
            </div>

            <div class="panel-title" style="margin-top:8px;">Платформы</div>
            <div class="platform-list">
              <div class="metric-box">
                <div class="metric-box-k">OnlyFans</div>
                <div class="metric-box-v">${platforms.onlyfans || 0}</div>
              </div>

              <div class="metric-box">
                <div class="metric-box-k">Fansly</div>
                <div class="metric-box-v">${platforms.fansly || 0}</div>
              </div>

              <div class="metric-box">
                <div class="metric-box-k">Ждут тест</div>
                <div class="metric-box-v">${summary.waiting_test || 0}</div>
              </div>

              <div class="metric-box">
                <div class="metric-box-k">Тест смена</div>
                <div class="metric-box-v">${summary.test_shift || 0}</div>
              </div>

              <div class="metric-box">
                <div class="metric-box-k">Не рассчитан</div>
                <div class="metric-box-v">${summary.unpaid || 0}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="dashboard-panels-bottom">
          <div class="dashboard-panel">
            <div class="panel-title">Top HR / TeamLead</div>
            <div class="top-people-list">
              ${
                topPeople.length
                  ? topPeople.map(person => `
                    <div class="person-box">
                      <div>
                        <div class="person-box-k">${person.name}</div>
                        <div class="person-box-sub">
                          Лиды: ${person.leads || 0} · Собесы: ${person.interviews || 0} · Принятые: ${person.hired || 0}
                        </div>
                      </div>
                      <div class="person-box-v">${(person.hired || 0) * 5 + (person.interviews || 0) * 2 + (person.leads || 0)}</div>
                    </div>
                  `).join('')
                  : `<div class="metric-box"><div class="metric-box-k">Пока нет данных по авторам событий</div><div class="metric-box-v">—</div></div>`
              }
            </div>
          </div>

          <div class="dashboard-panel">
            <div class="panel-title">Итог недели</div>
            <div class="platform-list">
              <div class="metric-box">
                <div class="metric-box-k">Лиды</div>
                <div class="metric-box-v">${summary.leads || 0}</div>
              </div>
              <div class="metric-box">
                <div class="metric-box-k">Собеседования</div>
                <div class="metric-box-v">${summary.interviews || 0}</div>
              </div>
              <div class="metric-box">
                <div class="metric-box-k">Принятые</div>
                <div class="metric-box-v">${summary.hired || 0}</div>
              </div>
              <div class="metric-box">
                <div class="metric-box-k">Отказы</div>
                <div class="metric-box-v">${summary.rejected || 0}</div>
              </div>
              <div class="metric-box">
                <div class="metric-box-k">Уволены</div>
                <div class="metric-box-v">${summary.fired || 0}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function startDashboardAutoRefresh() {
      stopDashboardAutoRefresh();

      dashboardAutoRefreshTimer = setInterval(() => {
        loadDashboardStats(true);
      }, 45000);
    }

    function stopDashboardAutoRefresh() {
      if (dashboardAutoRefreshTimer) {
        clearInterval(dashboardAutoRefreshTimer);
        dashboardAutoRefreshTimer = null;
      }
    }

    async function loadDashboardStats(isSilent = false) {
      const content = document.getElementById('dashboardContent');

      if (!isSilent && content) {
        content.innerHTML = `<div class="loading">Загружаем dashboard...</div>`;
      }

      try {
        const res = await api(`/api/dashboard/stats-live?week=${dashboardWeekMode}`);
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.error || 'Не удалось загрузить dashboard');
        }

        renderDashboardStats(data);
      } catch (err) {
        if (!isSilent && content) {
          content.innerHTML = `<div class="error-box">${err.message || 'Не удалось загрузить dashboard'}</div>`;
        }
      }
    }

    window.loadDashboardStats = loadDashboardStats;

    document.addEventListener('DOMContentLoaded', () => {
      loadDashboardStats();
      startDashboardAutoRefresh();
    });

    window.addEventListener('beforeunload', stopDashboardAutoRefresh);
  </script>
</body>
</html>
