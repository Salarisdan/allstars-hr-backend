<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllStars — Статистика</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{
      --bg:#0d0f14;
      --surface:#141720;
      --surface2:#1b1f2c;
      --surface3:#232840;
      --border:rgba(255,255,255,.07);
      --border2:rgba(255,255,255,.12);
      --accent:#4f6ef7;
      --accent2:#7d95ff;
      --accent-bg:rgba(79,110,247,.12);
      --accent-border:rgba(79,110,247,.32);
      --text:#e8eaf0;
      --text2:#9ba3bd;
      --text3:#58607c;
      --green:#34d399;
      --green-bg:rgba(52,211,153,.10);
      --green-border:rgba(52,211,153,.22);
      --yellow:#fbbf24;
      --yellow-bg:rgba(251,191,36,.10);
      --yellow-border:rgba(251,191,36,.22);
      --red:#f87171;
      --red-bg:rgba(248,113,113,.10);
      --red-border:rgba(248,113,113,.22);
      --purple:#a78bfa;
      --purple-bg:rgba(167,139,250,.10);
      --purple-border:rgba(167,139,250,.22);
      --shadow:0 10px 40px rgba(0,0,0,.24);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:'Manrope',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    .layout{
      display:flex;
      min-height:100vh;
    }

    .sidebar{
      width:230px;
      flex-shrink:0;
      position:fixed;
      left:0;
      top:0;
      bottom:0;
      background:var(--surface);
      border-right:1px solid var(--border);
      padding:1.2rem 0 1.5rem;
      overflow-y:auto;
      z-index:10;
    }

    .sidebar-logo{
      padding:0 1rem 1.15rem;
      border-bottom:1px solid var(--border);
      margin-bottom:.7rem;
    }

    .brand{
      font-size:16px;
      font-weight:800;
      color:var(--text);
    }

    .sub{
      font-size:11px;
      color:var(--text3);
      margin-top:3px;
    }

    .sidebar-section{
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--text3);
      padding:.45rem 1rem .25rem;
    }

    .nav-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 1rem;
      text-decoration:none;
      color:var(--text2);
      font-size:12px;
      border-left:2px solid transparent;
      transition:.15s;
    }

    .nav-item:hover{
      color:var(--text);
      background:rgba(255,255,255,.03);
    }

    .nav-item.active{
      color:var(--accent2);
      border-left-color:var(--accent);
      background:var(--accent-bg);
    }

    .main{
      margin-left:230px;
      width:100%;
      padding:1.6rem 1.6rem 3rem;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:1rem;
    }

    .title h1{
      font-size:30px;
      font-weight:800;
      line-height:1.1;
      letter-spacing:-.03em;
    }

    .title p{
      color:var(--text2);
      margin-top:6px;
      font-size:13px;
    }

    .btns{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      border:none;
      cursor:pointer;
      font-family:'Manrope',sans-serif;
      font-weight:700;
      font-size:13px;
      border-radius:12px;
      padding:.78rem 1rem;
      transition:.15s;
    }

    .btn-primary{
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
    }

    .btn-ghost{
      background:var(--surface2);
      border:1px solid var(--border);
      color:var(--text2);
    }

    .hero-stats{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:18px;
    }

    .stat-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
    }

    .stat-value{
      font-size:30px;
      font-weight:800;
      line-height:1;
    }

    .stat-label{
      margin-top:8px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text3);
      font-weight:800;
    }

    .sections{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-bottom:18px;
    }

    .section-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .section-title{
      font-size:18px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .section-badge{
      font-size:11px;
      font-weight:700;
      padding:5px 9px;
      border-radius:999px;
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
      white-space:nowrap;
    }

    .mini-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .mini-stat{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem;
    }

    .mini-value{
      font-size:24px;
      font-weight:800;
      line-height:1;
    }

    .mini-label{
      margin-top:7px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text3);
      font-weight:800;
    }

    .summary-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
    }

    .summary-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .summary-list{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
    }

    .summary-item{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem .9rem;
    }

    .summary-item .k{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text3);
      font-weight:800;
      margin-bottom:5px;
    }

    .summary-item .v{
      font-size:15px;
      font-weight:700;
    }

    .loading,
    .error-box{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      padding:1.1rem 1rem;
      color:var(--text2);
    }

    .error-box{
      color:var(--red);
      border-color:var(--red-border);
      background:var(--red-bg);
    }

    @media (max-width:1100px){
      .hero-stats{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }

      .sections{
        grid-template-columns:1fr;
      }

      .summary-list{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:920px){
      .sidebar{display:none}
      .main{margin-left:0;padding:1rem}
      .hero-stats,
      .mini-grid,
      .summary-list{
        grid-template-columns:1fr;
      }
    }

    .chart-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
      margin-top:18px;
    }

    .chart-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .chart-wrap{
      position:relative;
      width:100%;
      min-height:360px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="brand">AllStars</div>
        <div class="sub">Статистика</div>
      </div>

      <div class="sidebar-section">Навигация</div>
      <a class="nav-item" href="/index.html">🧑‍💼 Новый кандидат</a>
      <a class="nav-item" href="/candidates.html">👥 Кандидаты</a>
      <a class="nav-item" href="/interviews.html">📞 Собеседования</a>
      <a class="nav-item active" href="/dashboard.html">📊 Dashboard</a>
      <a class="nav-item" href="/team.html">🫂 Команда</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="title">
          <h1>Статистика</h1>
          <p>Актуальная аналитика из Google Таблиц: лиды, собеседования, ожидание и отказы.</p>
        </div>

        <div class="btns">
          <button class="btn btn-ghost" id="refreshBtn">Обновить</button>
        </div>
      </div>

      <div id="content">
        <div class="loading">Загружаем статистику...</div>
      </div>
    </main>
  </div>

  <script>
    const tokenKey = 'allstars_token';
    const token = localStorage.getItem(tokenKey);

    if (!token) {
      location.href = '/login.html';
    }

    const content = document.getElementById('content');
    const refreshBtn = document.getElementById('refreshBtn');

    function api(path, options = {}) {
      return fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
    }

    let weeklyChartInstance = null;

    function renderWeeklyChart(weekly = []) {
      const canvas = document.getElementById('weeklyChart');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');

      if (weeklyChartInstance) {
        weeklyChartInstance.destroy();
      }

      const labels = weekly.map(x => x.period || '—');
      const totalData = weekly.map(x => Number(x.total || 0));
      const interviewData = weekly.map(x => Number(x.interviews || 0));
      const waitingData = weekly.map(x => Number(x.waiting || 0));
      const rejectData = weekly.map(x => Number(x.rejects || 0));

      weeklyChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: 'Всего',
              data: totalData
            },
            {
              label: 'Собес',
              data: interviewData
            },
            {
              label: 'Ожид',
              data: waitingData
            },
            {
              label: 'Отказы',
              data: rejectData
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: {
            legend: {
              labels: {
                color: '#e8eaf0',
                font: {
                  family: 'Manrope'
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: '#9ba3bd',
                font: {
                  family: 'Manrope'
                }
              },
              grid: {
                color: 'rgba(255,255,255,.06)'
              }
            },
            y: {
              beginAtZero: true,
              ticks: {
                color: '#9ba3bd',
                font: {
                  family: 'Manrope'
                }
              },
              grid: {
                color: 'rgba(255,255,255,.06)'
              }
            }
          }
        }
      });
    }

    function renderStats(data) {
      const { totals, month, week } = data;

      content.innerHTML = `
        <section class="hero-stats">
          <div class="stat-card">
            <div class="stat-value">${totals.leads}</div>
            <div class="stat-label">Общее количество лидов</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${totals.interviews}</div>
            <div class="stat-label">Собеседования</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${totals.waiting}</div>
            <div class="stat-label">Ожидание</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${totals.rejects}</div>
            <div class="stat-label">Отказы</div>
          </div>
        </section>

        <section class="sections">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">За текущий месяц</div>
              <div class="section-badge">Месячная статистика</div>
            </div>

            <div class="mini-grid">
              <div class="mini-stat">
                <div class="mini-value">${month.leads}</div>
                <div class="mini-label">Лиды</div>
              </div>
              <div class="mini-stat">
                <div class="mini-value">${month.interviews}</div>
                <div class="mini-label">Собеседования</div>
              </div>
              <div class="mini-stat">
                <div class="mini-value">${month.waiting}</div>
                <div class="mini-label">Ожидание</div>
              </div>
              <div class="mini-stat">
                <div class="mini-value">${month.rejects}</div>
                <div class="mini-label">Отказы</div>
              </div>
            </div>
          </div>

          <div class="section-card">
            <div class="section-head">
              <div class="section-title">За последние 7 дней</div>
              <div class="section-badge">Недельная статистика</div>
            </div>

            <div class="mini-grid">
              <div class="mini-stat">
                <div class="mini-value">${week.leads}</div>
                <div class="mini-label">Лиды</div>
              </div>
              <div class="mini-stat">
                <div class="mini-value">${week.interviews}</div>
                <div class="mini-label">Собеседования</div>
              </div>
              <div class="mini-stat">
                <div class="mini-value">${week.waiting}</div>
                <div class="mini-label">Ожидание</div>
              </div>
              <div class="mini-stat">
                <div class="mini-value">${week.rejects}</div>
                <div class="mini-label">Отказы</div>
              </div>
            </div>
          </div>
        </section>

        <section class="summary-card">
          <div class="summary-title">Сводка</div>
          <div class="summary-list">
            <div class="summary-item">
              <div class="k">Всего лидов</div>
              <div class="v">${totals.leads}</div>
            </div>
            <div class="summary-item">
              <div class="k">Всего собеседований</div>
              <div class="v">${totals.interviews}</div>
            </div>
            <div class="summary-item">
              <div class="k">Всего ожидание</div>
              <div class="v">${totals.waiting}</div>
            </div>
            <div class="summary-item">
              <div class="k">Всего отказов</div>
              <div class="v">${totals.rejects}</div>
            </div>
            <div class="summary-item">
              <div class="k">Лиды за месяц</div>
              <div class="v">${month.leads}</div>
            </div>
            <div class="summary-item">
              <div class="k">Собесы за месяц</div>
              <div class="v">${month.interviews}</div>
            </div>
            <div class="summary-item">
              <div class="k">Лиды за 7 дней</div>
              <div class="v">${week.leads}</div>
            </div>
            <div class="summary-item">
              <div class="k">Собесы за 7 дней</div>
              <div class="v">${week.interviews}</div>
            </div>
          </div>
        </section>

        <section class="chart-card">
          <div class="chart-title">Статистика по неделям</div>
          <div class="chart-wrap">
            <canvas id="weeklyChart"></canvas>
          </div>
        </section>
      `;

      renderWeeklyChart(data.weekly || []);
    }

    async function loadStats() {
      content.innerHTML = `<div class="loading">Загружаем статистику...</div>`;

      const res = await api('/api/stats');
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Не удалось загрузить статистику');
      }

      const data = await res.json();
      renderStats(data);
    }

    refreshBtn.addEventListener('click', loadStats);

    loadStats().catch(err => {
      console.error(err);
      content.innerHTML = `<div class="error-box">${err.message || 'Ошибка загрузки статистики'}</div>`;
    });
  </script>
</body>
</html>
