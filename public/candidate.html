<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllStars — Кандидат</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0d0f14;
      --surface:#141720;
      --surface2:#1b1f2c;
      --surface3:#232840;
      --border:rgba(255,255,255,.07);
      --border2:rgba(255,255,255,.12);
      --accent:#4f6ef7;
      --accent2:#7d95ff;
      --accent-bg:rgba(79,110,247,.12);
      --accent-border:rgba(79,110,247,.32);
      --text:#e8eaf0;
      --text2:#9ba3bd;
      --text3:#58607c;
      --green:#34d399;
      --green-bg:rgba(52,211,153,.10);
      --green-border:rgba(52,211,153,.22);
      --yellow:#fbbf24;
      --yellow-bg:rgba(251,191,36,.10);
      --yellow-border:rgba(251,191,36,.22);
      --red:#f87171;
      --red-bg:rgba(248,113,113,.10);
      --red-border:rgba(248,113,113,.22);
      --purple:#a78bfa;
      --purple-bg:rgba(167,139,250,.10);
      --purple-border:rgba(167,139,250,.22);
      --shadow:0 10px 40px rgba(0,0,0,.24);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Manrope',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    .layout{display:flex;min-height:100vh}

    .sidebar{
      width:230px;
      flex-shrink:0;
      position:fixed;
      left:0;top:0;bottom:0;
      background:var(--surface);
      border-right:1px solid var(--border);
      padding:1.2rem 0 1.5rem;
      overflow-y:auto;
      z-index:10;
    }

    .sidebar-logo{
      padding:0 1rem 1.15rem;
      border-bottom:1px solid var(--border);
      margin-bottom:.7rem;
    }

    .brand{font-size:16px;font-weight:800;color:var(--text)}
    .sub{font-size:11px;color:var(--text3);margin-top:3px}

    .sidebar-section{
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--text3);
      padding:.45rem 1rem .25rem;
    }

    .nav-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 1rem;
      text-decoration:none;
      color:var(--text2);
      font-size:12px;
      border-left:2px solid transparent;
      transition:.15s;
    }

    .nav-item:hover{color:var(--text);background:rgba(255,255,255,.03)}
    .nav-item.active{color:var(--accent2);border-left-color:var(--accent);background:var(--accent-bg)}

    .main{
      margin-left:230px;
      width:100%;
      padding:1.6rem 1.6rem 3rem;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:1rem;
    }

    .title h1{
      font-size:30px;
      font-weight:800;
      line-height:1.1;
      letter-spacing:-.03em;
    }

    .title p{
      color:var(--text2);
      margin-top:6px;
      font-size:13px;
    }

    .quick-edit{
      margin-top:1rem;
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem .9rem;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .quick-edit label{
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .quick-edit select{
      width:100%;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      font-family:'Manrope',sans-serif;
    }

    .quick-edit-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .editor-box{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem 1rem;
      margin-top:1rem;
    }

    .editor-box label{
      display:block;
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      margin-bottom:6px;
    }

    .editor-box textarea{
      width:100%;
      min-height:180px;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      line-height:1.6;
      resize:vertical;
      font-family:'Manrope',sans-serif;
    }

    .editor-actions{
      display:flex;
      gap:8px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .comment-box{
      background:rgba(167,139,250,.08);
      border:1px solid var(--purple-border);
      border-radius:14px;
      padding:.9rem 1rem;
      margin-top:1rem;
    }

    .comment-box label{
      display:block;
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      margin-bottom:6px;
    }

    .comment-box textarea{
      width:100%;
      min-height:120px;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      line-height:1.6;
      resize:vertical;
      font-family:'Manrope',sans-serif;
    }

    .pipeline-box{
      margin-top:1rem;
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem .9rem;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .pipeline-box label{
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .pipeline-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    .pipeline-select{
      width:100%;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      font-family:'Manrope',sans-serif;
    }

    .pipeline-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:4px 9px;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
    }

    .btns{display:flex;gap:8px;flex-wrap:wrap}

    .btn{
      border:none;
      cursor:pointer;
      font-family:'Manrope',sans-serif;
      font-weight:700;
      font-size:13px;
      border-radius:12px;
      padding:.78rem 1rem;
      transition:.15s;
    }

    .btn-primary{
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
    }

    .btn-ghost{
      background:var(--surface2);
      border:1px solid var(--border);
      color:var(--text2);
    }

    .wrap{
      display:grid;
      grid-template-columns:380px minmax(0,1fr);
      gap:16px;
      align-items:start;
    }

    .card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card-body{padding:1rem}

    .avatar-row{
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-bottom:1rem;
    }

    .avatar{
      width:52px;height:52px;border-radius:50%;
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:16px;flex-shrink:0;
    }

    .name{
      font-size:20px;
      font-weight:800;
      line-height:1.2;
    }

    .tg{
      color:var(--accent2);
      font-size:13px;
      margin-top:4px;
      word-break:break-word;
    }

    .sub{
      color:var(--text3);
      font-size:12px;
      margin-top:5px;
    }

    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:4px 9px;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
    }

    .badge.blue{background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent2)}
    .badge.green{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
    .badge.yellow{background:var(--yellow-bg);border:1px solid var(--yellow-border);color:var(--yellow)}
    .badge.red{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
    .badge.purple{background:var(--purple-bg);border:1px solid var(--purple-border);color:var(--purple)}

    .score-box{
      margin-top:1rem;
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem 1rem;
    }

    .score-label{
      font-size:11px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .score{
      font-size:30px;
      font-weight:800;
      margin-top:4px;
    }

    .score span{
      font-size:14px;
      color:var(--text2);
      font-weight:500;
    }

    .field-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:1rem;
    }

    .field-box{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.75rem .85rem;
    }

    .field-box .k{
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      margin-bottom:5px;
    }

    .field-box .v{
      font-size:13px;
      line-height:1.5;
      word-break:break-word;
    }

    .section{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
      margin-bottom:16px;
    }

    .section-title{
      font-size:17px;
      font-weight:800;
      margin-bottom:.9rem;
      letter-spacing:-.02em;
    }

    .notes-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .note-box{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.8rem .9rem;
    }

    .note-title{
      font-size:12px;
      font-weight:800;
      color:var(--accent2);
      margin-bottom:6px;
    }

    .note-text{
      font-size:13px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .plain{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.8rem .9rem;
      font-size:13px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .ai-box{
      background:linear-gradient(180deg, rgba(79,110,247,.10), rgba(79,110,247,.05));
      border:1px solid var(--accent-border);
      border-radius:14px;
      padding:.9rem 1rem;
    }

    .ai-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:.8rem;
    }

    .ai-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      color:var(--accent2);
    }

    .ai-summary{
      font-size:13px;
      line-height:1.6;
      margin-bottom:.8rem;
    }

    .ai-cols{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .ai-list{
      background:rgba(255,255,255,.03);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.75rem .8rem;
    }

    .ai-list-title{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      color:var(--text3);
      margin-bottom:6px;
    }

    .ai-list ul{
      padding-left:16px;
      display:flex;
      flex-direction:column;
      gap:5px;
    }

    .ai-list li{
      font-size:13px;
      line-height:1.5;
    }

    .history{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .history-item{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.75rem .85rem;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .history-left{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    .muted{
      color:var(--text3);
      font-size:12px;
    }

    .empty{
      color:var(--text3);
      background:var(--surface3);
      border:1px dashed var(--border2);
      border-radius:12px;
      padding:1rem;
    }

    .panel{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      padding:1rem;
      margin-top:1rem;
    }

    .panel-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .panel-title h2{
      font-size:17px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .panel-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    #teamlead-handoff{
      width: 100%;
      min-height: 180px;
      resize: vertical;
    }

    .candidate-report-card{
      margin-top:16px;
      background:linear-gradient(180deg,#232840,#1b1f2c);
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow);
    }

    .candidate-report-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    .candidate-report-title{
      font-size:16px;
      font-weight:800;
      color:var(--text);
    }

    .candidate-report-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .candidate-report-btn{
      border:none;
      cursor:pointer;
      border-radius:12px;
      padding:.72rem .95rem;
      font-family:'Manrope',sans-serif;
      font-weight:800;
      font-size:12px;
      background:linear-gradient(135deg, rgba(79,110,247,.24), rgba(168,85,247,.16));
      border:1px solid rgba(79,110,247,.34);
      color:#dbeafe;
    }

    .candidate-report-textarea{
      width:100%;
      min-height:220px;
      resize:vertical;
      background:#0f1220;
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      color:var(--text);
      padding:14px;
      font-family:'Manrope',sans-serif;
      font-size:13px;
      line-height:1.55;
      outline:none;
    }

    @media (max-width: 1100px){
      .wrap{
        grid-template-columns:1fr;
      }
    }

    .mobile-nav-toggle{display:none}
    .mobile-nav-backdrop{display:none}
    .mobile-nav-toggle span{display:block;width:18px;height:2px;border-radius:999px;background:currentColor}
    .mobile-nav-toggle span + span{margin-top:4px}

    @media (max-width:1024px){
      .main{padding:1.15rem 1.15rem 2.25rem}
    }

    @media (max-width:920px){
      body.nav-open{overflow:hidden}
      .mobile-nav-toggle{
        display:inline-flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        position:fixed;
        top:12px;
        right:12px;
        width:48px;
        height:48px;
        border:none;
        border-radius:14px;
        background:rgba(20,23,32,.96);
        border:1px solid rgba(255,255,255,.12);
        color:var(--text);
        z-index:70;
        box-shadow:var(--shadow);
        cursor:pointer;
      }
      .mobile-nav-backdrop{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.48);
        opacity:0;
        pointer-events:none;
        transition:opacity .18s ease;
        z-index:55;
      }
      body.nav-open .mobile-nav-backdrop{opacity:1;pointer-events:auto}
      .layout{display:block}
      .sidebar{
        display:block;
        position:fixed;
        top:0;
        left:0;
        bottom:0;
        width:min(82vw,320px);
        padding:1rem 0 1.5rem;
        border-right:1px solid var(--border);
        border-bottom:none;
        overflow-y:auto;
        overflow-x:hidden;
        transform:translateX(-100%);
        transition:transform .2s ease;
        z-index:60;
        background:var(--surface);
      }
      body.nav-open .sidebar{transform:translateX(0)}
      .sidebar-logo,.sidebar-section{display:block}
      .nav-item{display:flex;border-left:2px solid transparent;border-bottom:none;border-radius:0;padding:7px 1rem;white-space:normal;background:none}
      .nav-item.active{border-bottom:none;border-left-color:var(--accent)}
      .main{margin-left:0;padding:4.75rem 1rem 1.25rem}
    }

    @media (max-width:768px){
      .main{padding:4.6rem .9rem 1rem}
      .topbar,.quick-edit-row,.editor-actions{flex-direction:column;align-items:stretch}
      .notes-grid,.ai-cols{grid-template-columns:1fr}
      .editor-box textarea,.comment-box textarea,.candidate-report-textarea{min-height:160px}
    }

    @media (max-width:390px){
      .main{padding:4.4rem .75rem 1rem}
      .title h1{font-size:22px}
      .mobile-nav-toggle{top:10px;right:10px;width:44px;height:44px}
      .sidebar{width:min(88vw,300px)}
    }
  </style>
</head>
<body>
  <button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="Открыть меню">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="brand">AllStars</div>
        <div class="sub">Карточка кандидата</div>
      </div>

      <div class="sidebar-section">Навигация</div>
      <a class="nav-item" href="/index.html">🧑‍💼 Новый кандидат</a>
      <a class="nav-item active" href="/candidates.html">👥 Кандидаты</a>
      <a class="nav-item" href="/interviews.html">📞 Собеседования</a>
      <a class="nav-item" href="/dashboard.html">📊 Dashboard</a>
      <a class="nav-item" href="/team-dashboard.html">🫂 Действующие</a>
      <a class="nav-item" href="/hr-needs.html">🎯 Потребности HR</a>
      <a class="nav-item" href="/team.html">👥 Команда</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="title">
          <h1 id="pageTitle">Кандидат</h1>
          <p id="pageSub">Загружаем данные...</p>
        </div>

        <div class="btns">
          <button class="btn btn-ghost" onclick="location.href='/candidates.html'">Назад к базе</button>
        </div>
      </div>

      <div class="wrap">
        <div id="leftCol"></div>
        <div id="rightCol"></div>
      </div>
    </main>
  </div>

  <script>
    const tokenKey = 'allstars_token';
    const token = localStorage.getItem(tokenKey);
    if (!token) location.href = '/login.html';

    const params = new URLSearchParams(location.search);
    const candidateId = params.get('id');

    const leftCol = document.getElementById('leftCol');
    const rightCol = document.getElementById('rightCol');
    let currentCandidate = null;

    function api(path, options = {}) {
      return fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
    }

    async function generateCandidateAISummary() {
      console.log('generateCandidateAISummary clicked');

      if (!currentCandidate) {
        alert('Кандидат ещё не загружен');
        return;
      }

      const notesEl =
        document.querySelector('#candidate-notes') ||
        document.querySelector('#edit-notes') ||
        document.querySelector('#notes') ||
        document.querySelector('textarea[name="notes"]');

      const notes = notesEl?.value?.trim() || currentCandidate.notes || '';
      const status = currentCandidate.status || '';

      console.log('AI summary payload source', {
        notes,
        status,
        currentCandidate
      });

      if (!notes) {
        alert('Сначала добавь заметки по кандидату');
        return;
      }

      const payload = {
        notes,
        status,
        candidate: {
          name: currentCandidate.name || '',
          age: currentCandidate.age || '',
          tg: currentCandidate.tg || '',
          exp: currentCandidate.exp || '',
          avgcheck: currentCandidate.avg_check || '',
          top: currentCandidate.top_pages || '',
          job: currentCandidate.occupation || '',
          english: currentCandidate.english || '',
          platforms: currentCandidate.platforms || '',
          shifts: currentCandidate.shifts || '',
          schedule: currentCandidate.schedule || ''
        }
      };

      try {
        console.log('sending /api/ai/summary', payload);

        const res = await api('/api/ai/summary', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

    function resolveLeadSource(candidate = {}) {
      const leadSource = String(candidate.lead_source || '').trim();
      if (leadSource) return leadSource;

      const pipelineValues = new Set(['manual', 'new', 'screening', 'interview', 'test_task', 'test_shift', 'hired', 'rejected']);
      const rawSource = String(candidate.source || '').trim();

      if (rawSource && !pipelineValues.has(rawSource)) {

      return '';

    function parseStructuredNotes(notes = '') {
      const raw = String(notes || '').trim();
      if (!raw) return { intro:'', sections:[], plain:'' };

      const divider = '────────────';
      const parts = raw.split(divider).map(x => x.trim()).filter(Boolean);

      let intro = '';
      let structuredText = raw;

      if (parts.length >= 2) {
        intro = parts[0];
        structuredText = parts.slice(1).join('\n\n');
      }

      const chunks = structuredText.split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
      const sections = [];
      const plain = [];

      for (const chunk of chunks) {
        const idx = chunk.indexOf(':');
        if (idx > 0 && idx < 60) {
          const title = chunk.slice(0, idx).trim();
          const text = chunk.slice(idx + 1).trim();

          const looksStructured = /опыт|платформы|метрики|ожидания|сигналы|мотивация|кейс|ошибки|стресс|следующий шаг|итог|фидбэк|фишки|апсейл|занятость|фон/i.test(title);

          if (looksStructured) {
            sections.push({ title, text });
          } else {
            plain.push(chunk);
          }
        } else {
          plain.push(chunk);
        }
      }

      return {
        intro,
        sections,
        plain: plain.join('\n\n')
      };
    }

    function splitInternalComment(notes = '') {
      const raw = String(notes || '');
      const marker = '\n\n[INTERNAL_COMMENT]\n';
      const index = raw.indexOf(marker);

      if (index === -1) {
        return {
          publicNotes: raw.trim(),
          internalComment: ''
        };
      }

      return {
        publicNotes: raw.slice(0, index).trim(),
        internalComment: raw.slice(index + marker.length).trim()
      };
    }

    function mergeInternalComment(publicNotes = '', internalComment = '') {
      const cleanPublic = String(publicNotes || '').trim();
      const cleanInternal = String(internalComment || '').trim();

      if (!cleanInternal) return cleanPublic;
      if (!cleanPublic) return `[INTERNAL_COMMENT]\n${cleanInternal}`;

      return `${cleanPublic}\n\n[INTERNAL_COMMENT]\n${cleanInternal}`;
    }

    function renderNotes(notes) {
      const split = splitInternalComment(notes);
      const parsed = parseStructuredNotes(split.publicNotes);

      let html = '';

      if (parsed.intro) {
        html += `
          <div class="note-box">
            <div class="note-title">Итог HR</div>
            <div class="note-text">${escapeHtml(parsed.intro)}</div>
          </div>
        `;
      }

      if (parsed.sections.length) {
        html += `<div class="notes-grid">`;
        html += parsed.sections.map(s => `
          <div class="note-box">
            <div class="note-title">${escapeHtml(s.title)}</div>
            <div class="note-text">${escapeHtml(s.text)}</div>
          </div>
        `).join('');
        html += `</div>`;
      }

      if (parsed.plain) {
        html += `<div class="plain">${escapeHtml(parsed.plain)}</div>`;
      }

      if (!html) {
        html = `<div class="empty">Нет заметок</div>`;
      }

      return html;
    }

        return;
      }

      const res = await api('/candidates');
      if (!res.ok) throw new Error('Не удалось загрузить кандидатов');
      const candidates = await res.json();
      const candidate = candidates.find(x => String(x.id) === String(candidateId));
      currentCandidate = candidate;
      console.log('currentCandidate loaded', currentCandidate);

      if (!candidate) {
        document.getElementById('pageSub').textContent = 'Кандидат не найден';
        leftCol.innerHTML = '<div class="empty">Кандидат не найден</div>';
        return;
      }

      document.getElementById('pageTitle').textContent = candidate.name || 'Кандидат';
      document.getElementById('pageSub').textContent = `Статус: ${candidate.status || 'Без статуса'} · Балл: ${candidate.total || 0}/50`;

      let historyData = null;
      try {
        const historyRes = await api(`/candidates/${candidateId}/history`);
        if (historyRes.ok) historyData = await historyRes.json();
      } catch {}

      renderLeft(candidate);
      renderRight(candidate, historyData);
      setTimeout(() => {
        generateCandidateReport();
      }, 50);
    }

    function buildCandidatePatchPayload(baseCandidate, fieldOverrides = {}) {
      const split = splitInternalComment(baseCandidate.notes || '');
      const nextNotes = Object.prototype.hasOwnProperty.call(fieldOverrides, 'notes')
        ? fieldOverrides.notes
        : mergeInternalComment(split.publicNotes, split.internalComment);

      return {
        fields: {
          name: baseCandidate.name || '',
          tg: baseCandidate.telegram || baseCandidate.tg || '',
          telegram: baseCandidate.telegram || baseCandidate.tg || '',
          age: baseCandidate.age || '',
          english: baseCandidate.english_level || baseCandidate.english || '',
          english_level: baseCandidate.english_level || baseCandidate.english || '',
          exp: baseCandidate.experience || baseCandidate.exp || '',
          experience: baseCandidate.experience || baseCandidate.exp || '',
          platform: baseCandidate.platform || baseCandidate.platforms || '',
          platforms: baseCandidate.platform || baseCandidate.platforms || '',
          shift: baseCandidate.shift || '',
          schedule: baseCandidate.schedule_preference || baseCandidate.schedule || '',
          schedule_preference: baseCandidate.schedule_preference || baseCandidate.schedule || '',
          top: baseCandidate.top_profile || baseCandidate.top_pages || '',
          top_pages: baseCandidate.top_pages || '',
          top_profile: baseCandidate.top_profile || baseCandidate.top_pages || '',
          avgcheck: baseCandidate.avg_check || '',
          avg_check: baseCandidate.avg_check || '',
          job: baseCandidate.main_activity || baseCandidate.job || '',
          main_activity: baseCandidate.main_activity || baseCandidate.job || '',
          interview_report: baseCandidate.interview_report || '',
          status: baseCandidate.status || '',
          notes: nextNotes,
          source: baseCandidate.source || '',
          lead_source: baseCandidate.lead_source || '',
          ...fieldOverrides
        },
        ratings: baseCandidate.ratings || {},
        total: baseCandidate.total || 0
      };
    }

    async function quickUpdateStatus() {
      if (!currentCandidate) return;

      const status = document.getElementById('quick-status')?.value || '';

      const payload = buildCandidatePatchPayload(currentCandidate, { status });

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось обновить статус');
        return;
      }

      await load();
    }

    async function saveNotes() {
      if (!currentCandidate) return;

      const publicNotes = document.getElementById('notes-editor')?.value || '';
      const internalComment = document.getElementById('internal-comment-editor')?.value || '';
      const notes = mergeInternalComment(publicNotes, internalComment);

      const payload = buildCandidatePatchPayload(currentCandidate, { notes });

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось сохранить заметки');
        return;
      }

      await load();
    }

    async function saveInternalComment() {
      if (!currentCandidate) return;

      const publicNotes = document.getElementById('notes-editor')?.value || '';
      const internalComment = document.getElementById('internal-comment-editor')?.value || '';
      const mergedNotes = mergeInternalComment(publicNotes, internalComment);

      const payload = buildCandidatePatchPayload(currentCandidate, { notes: mergedNotes });

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось сохранить комментарий');
        return;
      }

      await load();
    }

    async function savePipeline() {
      if (!currentCandidate) return;

      const pipeline = document.getElementById('quick-pipeline')?.value || '';

      const split = splitInternalComment(currentCandidate.notes || '');
      const notes = mergeInternalComment(split.publicNotes, split.internalComment);

      const payload = buildCandidatePatchPayload(currentCandidate, {
        notes,
        source: pipeline
      });

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось сохранить этап');
        return;
      }

      await load();
    }

    window.quickUpdateStatus = quickUpdateStatus;
    window.saveNotes = saveNotes;
    window.saveInternalComment = saveInternalComment;
    window.savePipeline = savePipeline;
    window.generateCandidateReport = generateCandidateReport;
    window.copyCandidateReport = copyCandidateReport;

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        generateCandidateReport();
      }, 250);
    });

    load().catch(err => {
      console.error(err);
      leftCol.innerHTML = '<div class="empty">Ошибка загрузки кандидата</div>';
      rightCol.innerHTML = '';
    });
  </script>
  <script>
    (function () {
      const toggle = document.getElementById('mobileNavToggle');
      const backdrop = document.getElementById('mobileNavBackdrop');
      const closeMobileNav = () => document.body.classList.remove('nav-open');
      const toggleMobileNav = () => document.body.classList.toggle('nav-open');

      toggle?.addEventListener('click', toggleMobileNav);
      backdrop?.addEventListener('click', closeMobileNav);
      document.querySelectorAll('.sidebar .nav-item').forEach(link => link.addEventListener('click', closeMobileNav));
      window.addEventListener('resize', () => {
        if (window.innerWidth > 920) closeMobileNav();
      });
    })();
  </script>
</body>
