<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllStars — Кандидат</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0d0f14;
      --surface:#141720;
      --surface2:#1b1f2c;
      --surface3:#232840;
      --border:rgba(255,255,255,.07);
      --border2:rgba(255,255,255,.12);
      --accent:#4f6ef7;
      --accent2:#7d95ff;
      --accent-bg:rgba(79,110,247,.12);
      
      --brand-pill-text:#b7c4ff;
      --brand-pill-border:rgba(125,149,255,.34);
      --brand-pill-bg:rgba(79,110,247,.16);
      --text:#e8eaf0;
      --text2:#9ba3bd;
      --text3:#58607c;
      --green:#34d399;
      --green-bg:rgba(52,211,153,.10);
      --green-border:rgba(52,211,153,.22);
      --yellow:#fbbf24;
      --yellow-bg:rgba(251,191,36,.10);
      --yellow-border:rgba(251,191,36,.22);
      --red:#f87171;
      --red-bg:rgba(248,113,113,.10);
      --red-border:rgba(248,113,113,.22);
      --purple:#a78bfa;
      --purple-bg:rgba(167,139,250,.10);
      --purple-border:rgba(167,139,250,.22);
      --shadow:0 10px 40px rgba(0,0,0,.24);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Manrope',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    .layout{display:flex;min-height:100vh}

    .sidebar{
      width:238px;
      flex-shrink:0;
      position:fixed;
      left:0;top:0;bottom:0;
      background:
        radial-gradient(160% 120% at 10% 0%, rgba(56,189,248,.12), rgba(56,189,248,0) 55%),
        radial-gradient(130% 100% at 90% 15%, rgba(79,110,247,.18), rgba(79,110,247,0) 58%),
        linear-gradient(180deg, #0f1320 0%, #0e1321 44%, #0c101c 100%);
      border-right:1px solid rgba(157,178,255,.16);
      padding:1rem .7rem 1.2rem;
      overflow-y:auto;
      z-index:10;
      box-shadow:
        24px 0 44px rgba(0,0,0,.38),
        inset -1px 0 0 rgba(255,255,255,.05);
      backdrop-filter:blur(8px);
    }

    .sidebar::before{
      content:'';
      position:absolute;
      left:10px;
      right:10px;
      top:10px;
      height:140px;
      border-radius:18px;
      border:1px solid rgba(125,149,255,.14);
      background:linear-gradient(180deg, rgba(125,149,255,.06), rgba(125,149,255,0));
      pointer-events:none;
    }

    .sidebar-logo{
      position:relative;
      margin:0 0 .95rem;
      padding:.95rem .95rem 1rem;
      border:1px solid rgba(157,178,255,.28);
      border-radius:18px;
      isolation:isolate;
      overflow:hidden;
      --mx:50%;
      --my:50%;
      background:
        radial-gradient(135% 115% at 0% 0%, rgba(125,149,255,.34), rgba(125,149,255,0) 52%),
        radial-gradient(130% 130% at 100% 100%, rgba(56,189,248,.16), rgba(56,189,248,0) 56%),
        linear-gradient(145deg, rgba(79,110,247,.24), rgba(79,110,247,.02));
      box-shadow:
        0 12px 26px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -12px 24px rgba(24,35,72,.35);
      transform:translateZ(0);
      transition:transform .2s ease, box-shadow .2s ease;
    }

    .sidebar-logo::before{
      content:'';
      position:absolute;
      inset:0;
      background:
        radial-gradient(210px 150px at var(--mx) var(--my), rgba(255,255,255,.16), rgba(255,255,255,0) 62%),
        linear-gradient(115deg, rgba(255,255,255,0) 22%, rgba(255,255,255,.15) 50%, rgba(255,255,255,0) 78%);
      mix-blend-mode:screen;
      opacity:.58;
      animation:brandSweep 4.8s ease-in-out infinite;
      pointer-events:none;
      z-index:0;
    }

    .sidebar-logo::after{
      content:'';
      position:absolute;
      width:116px;
      height:116px;
      right:-32px;
      top:-42px;
      border-radius:999px;
      background:radial-gradient(circle, rgba(56,189,248,.36) 0%, rgba(56,189,248,0) 72%);
      filter:blur(.5px);
      pointer-events:none;
      z-index:0;
    }

    .brand-row{
      display:flex;
      align-items:center;
      gap:9px;
      position:relative;
      z-index:2;
    }

    .brand-mark{
      width:28px;
      height:28px;
      flex:0 0 auto;
      border-radius:10px;
      border:1px solid rgba(198,216,255,.42);
      background:linear-gradient(145deg, rgba(176,197,255,.44), rgba(79,110,247,.2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      box-shadow:
        inset 0 0 16px rgba(125,149,255,.28),
        0 0 20px rgba(125,149,255,.32);
      position:relative;
      transform:translateZ(0);
      animation:starPulse 2.8s ease-in-out infinite;
    }

    .brand-mark::before{
      content:'';
      position:absolute;
      inset:-6px;
      border-radius:14px;
      background:conic-gradient(from 120deg, rgba(125,149,255,0), rgba(157,178,255,.56), rgba(56,189,248,.26), rgba(125,149,255,0));
      filter:blur(5px);
      opacity:.52;
      animation:starOrbit 4.4s linear infinite;
      pointer-events:none;
      z-index:-1;
    }

    .brand-star{
      line-height:1;
      color:#e9efff;
      text-shadow:
        0 0 6px rgba(255,255,255,.95),
        0 0 14px rgba(157,178,255,.9),
        0 0 26px rgba(125,149,255,.62);
      animation:starTwinkle 2.4s ease-in-out infinite;
    }

    .brand{
      font-family:'Unbounded', 'Manrope', sans-serif;
      font-size:20px;
      font-weight:800;
      letter-spacing:.03em;
      line-height:1;
      position:relative;
      display:inline-block;
      background:linear-gradient(180deg, #f5f7ff 5%, #b4c4ff 45%, #86a0ff 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:0 0 26px rgba(125,149,255,.42);
      filter:drop-shadow(0 0 10px rgba(125,149,255,.28));
      animation:brandGlow 3.2s ease-in-out infinite;
    }

    .brand::before,
    .brand::after{
      content:'';
      position:absolute;
      pointer-events:none;
      opacity:0;
      transition:opacity .22s ease, transform .22s ease;
    }

    .brand::before{
      left:-18px;
      right:-18px;
      top:36%;
      height:10px;
      border-radius:999px;
      background:linear-gradient(90deg, rgba(125,149,255,0), rgba(198,216,255,.78), rgba(56,189,248,0));
      filter:blur(7px);
      transform:translateX(-12px) scaleX(.78);
    }

    .brand::after{
      right:-30px;
      top:42%;
      width:26px;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg, rgba(255,255,255,.7), rgba(56,189,248,0));
      transform:translateX(-8px) rotate(-8deg);
      filter:drop-shadow(0 0 8px rgba(198,216,255,.75));
    }

    .sidebar-logo.is-hover .brand::before{
      opacity:.9;
      transform:translateX(5px) scaleX(1.06);
    }

    .sidebar-logo.is-hover .brand::after{
      opacity:.95;
      transform:translateX(6px) rotate(-8deg);
    }

    .brand .brand-char{
      display:inline-block;
      will-change:transform, filter, opacity;
      transition:transform .2s ease;
    }

    .sidebar-logo.is-hover .brand .brand-char{
      transform:translateY(-.4px);
    }

    .brand .brand-char.is-sparkle{
      animation:charSparkle .56s ease;
    }
    .sidebar-logo .sub{
      margin-top:8px;
      width:max-content;
      font-size:10px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--brand-pill-text);
      border:1px solid var(--brand-pill-border);
      background:var(--brand-pill-bg);
      border-radius:999px;
      padding:4px 8px;
      position:relative;
      z-index:2;
    }

    .brand-sparkles{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:1;
      overflow:hidden;
    }

    .brand-supernova{
      position:absolute;
      left:26px;
      top:18px;
      width:8px;
      height:8px;
      border-radius:999px;
      pointer-events:none;
      opacity:0;
      z-index:1;
    }

    .brand-supernova::before,
    .brand-supernova::after{
      content:'';
      position:absolute;
      inset:0;
      border-radius:999px;
      pointer-events:none;
    }

    .brand-supernova::before{
      background:radial-gradient(circle, rgba(255,255,255,.98) 0%, rgba(198,216,255,.88) 34%, rgba(125,149,255,.16) 76%, rgba(125,149,255,0) 100%);
      transform:scale(.6);
      opacity:0;
    }

    .brand-supernova::after{
      border:1.5px solid rgba(186,208,255,.64);
      transform:scale(.42);
      opacity:0;
      box-shadow:0 0 18px rgba(198,216,255,.64);
    }

    .sidebar-logo.is-supernova{
      animation:logoSupernova 1.05s ease;
    }

    .sidebar-logo.is-supernova .brand-supernova::before{
      animation:supernovaFlash .95s cubic-bezier(.2,.82,.26,1) both;
    }

    .sidebar-logo.is-supernova .brand-supernova::after{
      animation:supernovaRing .95s cubic-bezier(.2,.82,.26,1) both;
    }

    .sidebar-logo.is-supernova .brand{
      animation:brandGlow 3.2s ease-in-out infinite, supernovaText 1.05s ease;
    }

    .brand-constellation{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:1;
      overflow:hidden;
    }

    .brand-constellation .constellation-dot{
      position:absolute;
      width:3px;
      height:3px;
      border-radius:999px;
      background:rgba(231,240,255,.96);
      box-shadow:0 0 10px rgba(186,208,255,.82);
      opacity:0;
      animation:constellationDot .84s ease both;
      animation-delay:var(--delay, 0s);
    }

    .brand-constellation .constellation-link{
      position:absolute;
      height:1.2px;
      border-radius:999px;
      transform-origin:0 50%;
      background:linear-gradient(90deg, rgba(186,208,255,.12), rgba(215,232,255,.86), rgba(186,208,255,.12));
      box-shadow:0 0 7px rgba(186,208,255,.52);
      opacity:0;
      animation:constellationLink .9s ease both;
      animation-delay:var(--delay, 0s);
    }

    .brand-sparkles span{
      --size:2px;
      position:absolute;
      width:var(--size);
      height:var(--size);
      border-radius:999px;
      background:rgba(226,236,255,.95);
      box-shadow:0 0 10px rgba(186,208,255,.9);
      opacity:0;
      animation:brandSparkle 2.8s ease-in-out infinite;
      animation-delay:var(--delay, 0s);
      left:var(--x, 50%);
      top:var(--y, 50%);
    }

    .brand-shooting-star{
      position:absolute;
      left:-24px;
      top:28px;
      width:70px;
      height:1.8px;
      border-radius:999px;
      background:linear-gradient(90deg, rgba(255,255,255,0), rgba(215,232,255,.95), rgba(56,189,248,0));
      opacity:0;
      transform:rotate(-14deg) translateX(-25px);
      pointer-events:none;
      z-index:1;
    }

    .brand-shooting-star.is-active{
      animation:shootingStar 1.15s cubic-bezier(.16,.88,.3,1) both;
    }

    .brand-shooting-star.alt{
      width:56px;
      height:1.6px;
      top:42px;
      background:linear-gradient(90deg, rgba(255,255,255,0), rgba(191,245,255,.92), rgba(56,189,248,0));
      transform:rotate(-8deg) translateX(-20px);
      filter:drop-shadow(0 0 6px rgba(125,149,255,.55));
    }

    .brand-shooting-star.alt.is-active{
      animation:shootingStarAlt 1.24s cubic-bezier(.2,.86,.3,1) both;
    }

    .brand-mark.is-flare .brand-star{
      animation:starFlare .44s ease;
    }

    @keyframes brandSweep{
      0%, 100%{transform:translateX(-22%)}
      50%{transform:translateX(22%)}
    }

    @keyframes starPulse{
      0%, 100%{transform:translateY(0) scale(1)}
      50%{transform:translateY(-1px) scale(1.035)}
    }

    @keyframes starOrbit{
      0%{transform:rotate(0deg)}
      100%{transform:rotate(360deg)}
    }

    @keyframes starTwinkle{
      0%, 100%{opacity:.9; transform:scale(.98)}
      45%{opacity:1; transform:scale(1.08)}
      72%{opacity:.8; transform:scale(1)}
    }

    @keyframes brandGlow{
      0%, 100%{letter-spacing:.03em; filter:drop-shadow(0 0 10px rgba(125,149,255,.28))}
      50%{letter-spacing:.04em; filter:drop-shadow(0 0 16px rgba(125,149,255,.44))}
    }

    @keyframes brandSparkle{
      0%, 100%{opacity:0; transform:scale(.5)}
      32%{opacity:.95; transform:scale(1)}
      62%{opacity:.2; transform:scale(.7)}
    }

    @keyframes starFlare{
      0%{transform:scale(1)}
      50%{transform:scale(1.24)}
      100%{transform:scale(1)}
    }

    @keyframes shootingStar{
      0%{opacity:0; transform:rotate(-14deg) translateX(-26px)}
      18%{opacity:1}
      100%{opacity:0; transform:rotate(-14deg) translateX(232px)}
    }

    @keyframes shootingStarAlt{
      0%{opacity:0; transform:rotate(-8deg) translateX(-22px)}
      22%{opacity:1}
      100%{opacity:0; transform:rotate(-8deg) translateX(206px)}
    }

    @keyframes charSparkle{
      0%{transform:translateY(0) scale(1); opacity:1; filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
      45%{transform:translateY(-1.2px) scale(1.09); opacity:1; filter:drop-shadow(0 0 10px rgba(225,239,255,.9))}
      100%{transform:translateY(0) scale(1); opacity:1; filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
    }

    @keyframes logoSupernova{
      0%, 100%{transform:translateZ(0) scale(1)}
      40%{transform:translateZ(0) scale(1.015)}
    }

    @keyframes supernovaFlash{
      0%{opacity:0; transform:scale(.5)}
      20%{opacity:1; transform:scale(2.7)}
      100%{opacity:0; transform:scale(5.2)}
    }

    @keyframes supernovaRing{
      0%{opacity:0; transform:scale(.45)}
      28%{opacity:.9; transform:scale(3.1)}
      100%{opacity:0; transform:scale(5.6)}
    }

    @keyframes supernovaText{
      0%, 100%{filter:drop-shadow(0 0 10px rgba(125,149,255,.28))}
      40%{filter:drop-shadow(0 0 24px rgba(198,216,255,.85))}
    }

    @keyframes constellationDot{
      0%{opacity:0; transform:scale(.4)}
      34%{opacity:1; transform:scale(1)}
      100%{opacity:0; transform:scale(.72)}
    }

    @keyframes constellationLink{
      0%{opacity:0; transform:scaleX(.25)}
      40%{opacity:.95; transform:scaleX(1)}
      100%{opacity:0; transform:scaleX(1)}
    }

    .sidebar-section{
      font-size:10px;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:#7d89ae;
      padding:.42rem .34rem .32rem;
      margin:0 0 .2rem;
    }

    .nav-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 10px;
      text-decoration:none;
      color:#b6c0df;
      font-size:12px;
      border:1px solid transparent;
      border-radius:13px;
      transition:transform .16s ease, color .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
      position:relative;
      margin-bottom:2px;
    }

    .nav-item:hover{
      color:var(--text);
      background:rgba(125,149,255,.08);
      border-color:rgba(125,149,255,.22);
      transform:translateX(2px);
      box-shadow:0 8px 18px rgba(0,0,0,.2);
    }

    .nav-item.active{
      color:#ebf0ff;
      border-color:rgba(125,149,255,.4);
      background:
        linear-gradient(90deg, rgba(79,110,247,.3), rgba(79,110,247,.08)),
        rgba(255,255,255,.02);
      box-shadow:
        inset 0 0 0 1px rgba(125,149,255,.24),
        0 10px 18px rgba(18,27,55,.38);
      transform:translateX(2px);
    }

    .nav-item::before{
      content:'';
      position:absolute;
      left:-7px;
      top:50%;
      width:3px;
      height:0;
      border-radius:999px;
      transform:translateY(-50%);
      background:linear-gradient(180deg, #9fb3ff, #38bdf8);
      opacity:0;
      transition:height .16s ease, opacity .16s ease;
    }

    .nav-item.active::before{
      height:18px;
      opacity:1;
    }

    .nav-icon{
      width:24px;
      height:24px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      font-size:13px;
      box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);
      transition:transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .nav-label{
      flex:1;
      line-height:1.2;
      font-weight:700;
    }

    .nav-dot{
      width:6px;
      height:6px;
      border-radius:999px;
      background:rgba(157,178,255,.45);
      opacity:0;
      transform:scale(.6);
      transition:opacity .16s ease, transform .16s ease;
    }

    .nav-item:hover .nav-icon,
    .nav-item.active .nav-icon{
      transform:translateY(-1px) scale(1.03);
      border-color:rgba(157,178,255,.32);
      background:linear-gradient(160deg, rgba(125,149,255,.24), rgba(125,149,255,.08));
    }

    .nav-item.active .nav-dot{
      opacity:1;
      transform:scale(1);
    }

    .main{
      margin-left:238px;
      width:100%;
      padding:1.6rem 1.6rem 3rem;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:1rem;
    }

    .title h1{
      font-size:30px;
      font-weight:800;
      line-height:1.1;
      letter-spacing:-.03em;
    }

    .title p{
      color:var(--text2);
      margin-top:6px;
      font-size:13px;
    }

    .quick-edit{
      margin-top:1rem;
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem .9rem;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .quick-edit label{
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .quick-edit select{
      width:100%;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      font-family:'Manrope',sans-serif;
    }

    .quick-edit-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .editor-box{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem 1rem;
      margin-top:1rem;
    }

    .editor-box label{
      display:block;
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      margin-bottom:6px;

    .editor-box textarea{

      color:var(--text);

    }

    .editor-actions{
      display:flex;
      gap:8px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .comment-box{
      background:rgba(167,139,250,.08);
      border:1px solid var(--purple-border);
      border-radius:14px;
      padding:.9rem 1rem;
      margin-top:1rem;
    }

    .comment-box label{
      display:block;
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      margin-bottom:6px;
    }

    .comment-box textarea{
      width:100%;
      min-height:120px;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      line-height:1.6;
      resize:vertical;
      font-family:'Manrope',sans-serif;
    }

    .pipeline-box{
      margin-top:1rem;
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem .9rem;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .pipeline-box label{
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .pipeline-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    .pipeline-select{
      width:100%;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      font-family:'Manrope',sans-serif;
    }

    .pipeline-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:4px 9px;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
    }

    .btns{display:flex;gap:8px;flex-wrap:wrap}

  <script>
    const tokenKey = 'allstars_token';
    const token = localStorage.getItem(tokenKey);
    if (!token) location.href = '/login.html';

    const params = new URLSearchParams(location.search);
    const candidateId = params.get('id');

    const leftCol = document.getElementById('leftCol');
    const rightCol = document.getElementById('rightCol');
    let currentCandidate = null;
    let STATUS_OPTIONS = [];

    function api(path, options = {}) {
      return fetch(window.AllStarsConfig?.resolveApiPath?.(path) || path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
    }

    async function loadStatusOptions() {
      const res = await api('/api/status-options');
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        throw new Error(data.error || 'Не удалось загрузить статусы');
      }

      STATUS_OPTIONS = Array.isArray(data.candidates) ? data.candidates : [];
    }

    async function generateCandidateAISummary() {
      console.log('generateCandidateAISummary clicked');

      if (!currentCandidate) {
        alert('Кандидат ещё не загружен');
        return;
      }

      const notesEl =
        document.querySelector('#candidate-notes') ||
        document.querySelector('#edit-notes') ||
        document.querySelector('#notes') ||
        document.querySelector('textarea[name="notes"]');

      const notes = notesEl?.value?.trim() || currentCandidate.notes || '';
      const status = currentCandidate.status || '';

      console.log('AI summary payload source', {
        notes,
        status,
        currentCandidate
      });

      if (!notes) {
        alert('Сначала добавь заметки по кандидату');
        return;
      }

      const payload = {
        notes,
        status,
        candidate: {
          name: currentCandidate.name || '',
          age: currentCandidate.age || '',
          tg: currentCandidate.tg || '',
          exp: currentCandidate.exp || '',
          avgcheck: currentCandidate.avg_check || '',
          top: currentCandidate.top_pages || '',
          job: currentCandidate.occupation || '',
          english: currentCandidate.english || '',
          platforms: currentCandidate.platforms || '',
          shifts: currentCandidate.shifts || '',
          schedule: currentCandidate.schedule || ''
        }
      };

      try {
        console.log('sending /api/ai/summary', payload);

        const res = await api('/api/ai/summary', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        console.log('/api/ai/summary response', res.status, data);

        if (!res.ok) {
          alert(data.error || 'Ошибка генерации summary');
          return;
        }

        if (notesEl) {
          notesEl.value = data.summary || notes;
        } else {
          alert('Не найдено поле заметок для вставки результата');
        }
      } catch (err) {
        console.error('generateCandidateAISummary failed', err);
        alert('Ошибка генерации summary');
      }
    }

    async function generateCandidateTeamleadHandoff() {
      console.log('generateCandidateTeamleadHandoff clicked');

      if (!currentCandidate) {
        alert('Кандидат ещё не загружен');
        return;
      }

      const notesEl =
        document.querySelector('#candidate-notes') ||
        document.querySelector('#edit-notes') ||
        document.querySelector('#notes') ||
        document.querySelector('textarea[name="notes"]');

      const handoffEl = document.getElementById('teamlead-handoff');

      const notes = notesEl?.value?.trim() || currentCandidate.notes || '';
      const status = currentCandidate.status || '';

      console.log('AI handoff payload source', {
        notes,
        status,
        currentCandidate,
        handoffElExists: !!handoffEl
      });

      if (!notes) {
        alert('Сначала добавь заметки по кандидату');
        return;
      }

      if (!handoffEl) {
        alert('Не найдено поле "Передача тимлиду"');
        return;
      }

      const payload = {
        notes,
        status,
        candidate: {
          name: currentCandidate.name || '',
          age: currentCandidate.age || '',
          tg: currentCandidate.tg || '',
          exp: currentCandidate.exp || '',
          avgcheck: currentCandidate.avg_check || '',
          top: currentCandidate.top_pages || '',
          job: currentCandidate.occupation || '',
          english: currentCandidate.english || '',
          platforms: currentCandidate.platforms || '',
          shifts: currentCandidate.shifts || '',
          schedule: currentCandidate.schedule || ''
        }

    function escapeHtml(str = '') {

    function formatDate(date) {
      if (!date) return '—';
      const d = new Date(date);
      return d.toLocaleString('ru-RU', {
        day:'2-digit',
        month:'2-digit',
        year:'numeric',
        hour:'2-digit',
        minute:'2-digit'
      });
    }

    function formatDateOnly(date) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '—';
      return date.toLocaleDateString('ru-RU', {
        day:'2-digit',
        month:'2-digit',
        year:'numeric'
      });
    }

    function parseDateSafe(value) {
      if (!value) return null;
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return null;
      return d;
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function addOneCalendarMonth(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const day = date.getDate();

      const targetMonth = month + 1;
      const targetYear = year + Math.floor(targetMonth / 12);
      const targetMonthNormalized = ((targetMonth % 12) + 12) % 12;
      const lastDayTargetMonth = new Date(targetYear, targetMonthNormalized + 1, 0).getDate();
      const targetDay = Math.min(day, lastDayTargetMonth);

      return new Date(
        targetYear,
        targetMonthNormalized,
        targetDay,
        date.getHours(),
        date.getMinutes(),
        date.getSeconds(),
        date.getMilliseconds()
      );
    }

    function resolveLeadSource(candidate = {}) {
      const isLikelyDateTime = (value = '') => {
        const s = String(value || '').trim();
        if (!s) return false;
        if (/^\d{2}\.\d{2}\.\d{4}(?:\s+\d{1,2}:\d{2})?$/.test(s)) return true;
        if (/^\d{4}-\d{2}-\d{2}(?:[ T]\d{1,2}:\d{2}(?::\d{2})?)?$/.test(s)) return true;
        return false;
      };

      const isValidSource = (value = '') => {
        const s = String(value || '').trim();
        if (!s || isLikelyDateTime(s)) return false;

        const pipelineValues = new Set(['manual', 'new', 'screening', 'interview', 'test_task', 'test_shift', 'hired', 'rejected']);
        return !pipelineValues.has(s.toLowerCase());
      };

      const leadSource = String(candidate.lead_source || '').trim();
      if (isValidSource(leadSource)) return leadSource;

      const candidateSource = String(candidate.candidate_source || '').trim();
      if (isValidSource(candidateSource)) return candidateSource;

      const sourceName = String(candidate.source_name || '').trim();
      if (isValidSource(sourceName)) return sourceName;

      const rawSource = String(candidate.source || '').trim();

      if (isValidSource(rawSource)) {
        return rawSource;
      }

      return '';
    }

    function looksLikeReferralSource(source = '') {
      const value = String(source || '').trim();
      if (!value) return false;

      const hasTaggedReferrer = /(^|\s)@[a-zA-Z0-9_]{3,}/.test(value);
      if (hasTaggedReferrer) return true;

      const normalized = value.toLowerCase();
      const referralPhrases = [
        /узнал[аи]?\s+от/u,
        /по\s+рекомендац/u,
        /пригласил[аи]?/u,
        /реферал/u,
        /\bреф\b/u,
        /referral/i,
        /\bref\b/i
      ];

      return referralPhrases.some(pattern => pattern.test(normalized));
    }

    function isWorkingStatus(status = '') {
      return String(status || '').toLowerCase().includes('работает');
    }

    function resolveWorkStartDate(candidate = {}) {
      const hiredAt = parseDateSafe(candidate.hired_at);
      if (hiredAt) return hiredAt;

      const startedAt = parseDateSafe(candidate.started_at);
      if (startedAt) return startedAt;

      const candidates = [
        parseDateSafe(candidate.created_at),
        parseDateSafe(candidate.status_changed_at),
        parseDateSafe(candidate.updated_at)
      ].filter(Boolean);

      if (!candidates.length) return null;

      // If hire date is missing, keep the earliest known lifecycle date
      // so payout countdown does not shift after later status edits.
      let earliest = candidates[0];
      for (const d of candidates) {
        if (d.getTime() < earliest.getTime()) earliest = d;
      }

      return earliest;
    }

    function getWorkReport(candidate = {}) {
      const leadSource = resolveLeadSource(candidate);
      if (!looksLikeReferralSource(leadSource)) return null;
      if (!isWorkingStatus(candidate.status || '')) return null;

      const workStartDate = resolveWorkStartDate(candidate);
      if (!workStartDate) return null;

      const payoutDate = addOneCalendarMonth(workStartDate);

      const today = startOfDay(new Date());
      const payoutDay = startOfDay(payoutDate);
      const msPerDay = 24 * 60 * 60 * 1000;
      const daysDiff = Math.round((payoutDay.getTime() - today.getTime()) / msPerDay);

      if (daysDiff > 0) {
        return {
          workStartDate,
          payoutDate,
          badgeText: `До выплаты ${daysDiff} дн.`,
          badgeClass: 'warn',
          remainingDaysText: `${daysDiff} дн.`
        };
      }

      if (daysDiff === 0) {
        return {
          workStartDate,
          payoutDate,
          badgeText: 'Выплата сегодня',
          badgeClass: 'ok',
          remainingDaysText: '0 дн.'
        };
      }

      return {
        workStartDate,
        payoutDate,
        badgeText: `Просрочено ${Math.abs(daysDiff)} дн.`,
        badgeClass: 'alert',
        remainingDaysText: `-${Math.abs(daysDiff)} дн.`
      };
    }

    function parseStructuredNotes(notes = '') {
      const raw = String(notes || '').trim();
      if (!raw) return { intro:'', sections:[], plain:'' };

      const divider = '────────────';
      const parts = raw.split(divider).map(x => x.trim()).filter(Boolean);

      let intro = '';
      let structuredText = raw;

      if (parts.length >= 2) {
        intro = parts[0];
        structuredText = parts.slice(1).join('\n\n');
      }

      const chunks = structuredText.split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
      const sections = [];
      const plain = [];

      for (const chunk of chunks) {
        const idx = chunk.indexOf(':');
        if (idx > 0 && idx < 60) {
          const title = chunk.slice(0, idx).trim();
          const text = chunk.slice(idx + 1).trim();

          const looksStructured = /опыт|платформы|метрики|ожидания|сигналы|мотивация|кейс|ошибки|стресс|следующий шаг|итог|фидбэк|фишки|апсейл|занятость|фон/i.test(title);

          if (looksStructured) {
            sections.push({ title, text });
          } else {
            plain.push(chunk);
          }
        } else {
          plain.push(chunk);
        }
      }

      return {
        intro,
        sections,
        plain: plain.join('\n\n')
      };
    }

    function splitInternalComment(notes = '') {
      const raw = String(notes || '');
      const marker = '\n\n[INTERNAL_COMMENT]\n';
      const index = raw.indexOf(marker);

      if (index === -1) {
        return {
          publicNotes: raw.trim(),
          internalComment: ''
        };
      }

      return {
        publicNotes: raw.slice(0, index).trim(),
        internalComment: raw.slice(index + marker.length).trim()
      };
    }

    function mergeInternalComment(publicNotes = '', internalComment = '') {
      const cleanPublic = String(publicNotes || '').trim();
      const cleanInternal = String(internalComment || '').trim();

      if (!cleanInternal) return cleanPublic;
      if (!cleanPublic) return `[INTERNAL_COMMENT]\n${cleanInternal}`;

      return `${cleanPublic}\n\n[INTERNAL_COMMENT]\n${cleanInternal}`;
    }

    function renderNotes(notes) {
      const split = splitInternalComment(notes);
      const parsed = parseStructuredNotes(split.publicNotes);

      let html = '';

      if (parsed.intro) {
        html += `
          <div class="note-box">
            <div class="note-title">Итог HR</div>
            <div class="note-text">${escapeHtml(parsed.intro)}</div>
          </div>
        `;
      }

      if (parsed.sections.length) {
        html += `<div class="notes-grid">`;
        html += parsed.sections.map(s => `
          <div class="note-box">
            <div class="note-title">${escapeHtml(s.title)}</div>
            <div class="note-text">${escapeHtml(s.text)}</div>
          </div>
        `).join('');
        html += `</div>`;
      }

      if (parsed.plain) {
        html += `<div class="plain">${escapeHtml(parsed.plain)}</div>`;
      }

      if (!html) {
        html = `<div class="empty">Нет заметок</div>`;
      }

      return html;
    }

                </button>
                <button type="button" class="candidate-report-btn" onclick="copyCandidateReport()">
                  Скопировать отчет
                </button>
              </div>
            </div>

            <textarea
              id="candidateReportOutput"
              class="candidate-report-textarea"
              placeholder="Здесь появится структурированный отчет по кандидату..."
            >${escapeHtml(candidate.interview_report || '')}</textarea>
          </section>

          <div class="panel">
            <div class="panel-title">
              <h2>AI помощник</h2>
              <div class="panel-actions">
                <button class="btn btn-ghost" type="button" onclick="generateCandidateAISummary()">🤖 Summary</button>
                <button class="btn btn-ghost" type="button" onclick="generateCandidateTeamleadHandoff()">🤖 Передача тимлиду</button>
                <button class="btn btn-ghost" type="button" onclick="copyTeamleadHandoff()">📋 Скопировать передачу</button>
              </div>
            </div>

            <div class="field" style="margin-top:12px;">
              <label>Передача тимлиду</label>
              <textarea id="teamlead-handoff" rows="10" placeholder="Здесь появится структурированная передача кандидата тимлиду..."></textarea>
            </div>
          </div>
        </section>
      `;

      if (historyData?.ai) {
        const ai = historyData.ai;
        html += `
          <section class="section">
            <div class="section-title">AI Insight</div>
            <div class="ai-box">
              <div class="ai-top">
                <div class="ai-title">Рекомендация</div>
                <span class="badge blue">${escapeHtml(ai.recommendation || 'REVIEW')} · ${escapeHtml(String(ai.confidence || 0))}%</span>
              </div>
              <div class="ai-summary">${escapeHtml(ai.summary || '')}</div>
              <div class="ai-cols">
                <div class="ai-list">
                  <div class="ai-list-title">Сильные стороны</div>
                  <ul>
                    ${(Array.isArray(ai.strengths) && ai.strengths.length ? ai.strengths : ['Нет данных']).map(x => `<li>${escapeHtml(x)}</li>`).join('')}
                  </ul>
                </div>
                <div class="ai-list">
                  <div class="ai-list-title">Риски</div>
                  <ul>
                    ${(Array.isArray(ai.risks) && ai.risks.length ? ai.risks : ['Нет данных']).map(x => `<li>${escapeHtml(x)}</li>`).join('')}
                  </ul>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      html += `
        <section class="section">
          <div class="section-title">История статусов</div>
          ${
            historyData?.history?.length
              ? `<div class="history">
                  ${historyData.history.map(h => `
                    <div class="history-item">
                      <div class="history-left">
                        <span class="badge ${statusMeta(h.status)}">${escapeHtml(h.status)}</span>
                        <span>${escapeHtml(h.changed_by_name || 'Система')}</span>
                      </div>
                      <div class="muted">${formatDate(h.created_at)}</div>
                    </div>
                  `).join('')}
                </div>`
              : `<div class="empty">История пока пустая</div>`
          }
        </section>
      `;

      rightCol.innerHTML = html;
    }

    async function load() {
      if (!candidateId) {
        document.getElementById('pageSub').textContent = 'Не передан id кандидата';
        leftCol.innerHTML = '<div class="empty">Не передан id кандидата</div>';
        return;
      }

      if (!STATUS_OPTIONS.length) {
        await loadStatusOptions();
      }

      const res = await api('/candidates');
      if (!res.ok) throw new Error('Не удалось загрузить кандидатов');
      const candidates = await res.json();
      const candidate = candidates.find(x => String(x.id) === String(candidateId));
      currentCandidate = candidate;
      console.log('currentCandidate loaded', currentCandidate);

      if (!candidate) {
        document.getElementById('pageSub').textContent = 'Кандидат не найден';
        leftCol.innerHTML = '<div class="empty">Кандидат не найден</div>';
        return;
      }

      document.getElementById('pageTitle').textContent = candidate.name || 'Кандидат';
      document.getElementById('pageSub').textContent = `Статус: ${candidate.status || 'Без статуса'} · Балл: ${candidate.total || 0}/50`;

      let historyData = null;
      try {
        const historyRes = await api(`/candidates/${candidateId}/history`);
        if (historyRes.ok) historyData = await historyRes.json();
      } catch {}

      renderLeft(candidate);
      renderRight(candidate, historyData);
      setTimeout(() => {
        generateCandidateReport();
      }, 50);
    }

    function buildCandidatePatchPayload(baseCandidate, fieldOverrides = {}) {
      const split = splitInternalComment(baseCandidate.notes || '');
      const nextNotes = Object.prototype.hasOwnProperty.call(fieldOverrides, 'notes')
        ? fieldOverrides.notes
        : mergeInternalComment(split.publicNotes, split.internalComment);

      return {
        fields: {
          name: baseCandidate.name || '',
          tg: baseCandidate.telegram || baseCandidate.tg || '',
          telegram: baseCandidate.telegram || baseCandidate.tg || '',
          age: baseCandidate.age || '',
          english: baseCandidate.english_level || baseCandidate.english || '',
          english_level: baseCandidate.english_level || baseCandidate.english || '',
          exp: baseCandidate.experience || baseCandidate.exp || '',
          experience: baseCandidate.experience || baseCandidate.exp || '',
          platform: baseCandidate.platform || baseCandidate.platforms || '',
          platforms: baseCandidate.platform || baseCandidate.platforms || '',
          shift: baseCandidate.shift || '',
          schedule: baseCandidate.schedule_preference || baseCandidate.schedule || '',
          schedule_preference: baseCandidate.schedule_preference || baseCandidate.schedule || '',
          top: baseCandidate.top_profile || baseCandidate.top_pages || '',
          top_pages: baseCandidate.top_pages || '',
          top_profile: baseCandidate.top_profile || baseCandidate.top_pages || '',
          avgcheck: baseCandidate.avg_check || '',
          avg_check: baseCandidate.avg_check || '',
          job: baseCandidate.main_activity || baseCandidate.job || '',
          main_activity: baseCandidate.main_activity || baseCandidate.job || '',
          interview_report: baseCandidate.interview_report || '',
          status: baseCandidate.status || '',
          notes: nextNotes,
          source: baseCandidate.source || '',
          lead_source: resolveLeadSource(baseCandidate),
          candidate_source: resolveLeadSource(baseCandidate),
          source_name: resolveLeadSource(baseCandidate),
          ...fieldOverrides
        },
        ratings: baseCandidate.ratings || {},
        total: baseCandidate.total || 0
      };
    }

    async function quickUpdateStatus() {
      if (!currentCandidate) return;

      const status = document.getElementById('quick-status')?.value || '';

      const payload = buildCandidatePatchPayload(currentCandidate, { status });

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось обновить статус');
        return;
      }

      await load();
    }

    async function saveNotes() {
      if (!currentCandidate) return;

      const publicNotes = document.getElementById('notes-editor')?.value || '';
      const internalComment = document.getElementById('internal-comment-editor')?.value || '';
      const notes = mergeInternalComment(publicNotes, internalComment);

      const payload = buildCandidatePatchPayload(currentCandidate, { notes });

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось сохранить заметки');
        return;
      }

      await load();
    }

    async function saveInternalComment() {
      if (!currentCandidate) return;

      const publicNotes = document.getElementById('notes-editor')?.value || '';
      const internalComment = document.getElementById('internal-comment-editor')?.value || '';
      const mergedNotes = mergeInternalComment(publicNotes, internalComment);

      const payload = buildCandidatePatchPayload(currentCandidate, { notes: mergedNotes });

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось сохранить комментарий');
        return;
      }

      await load();
    }

    async function savePipeline() {
      if (!currentCandidate) return;

      const pipeline = document.getElementById('quick-pipeline')?.value || '';

      const split = splitInternalComment(currentCandidate.notes || '');
      const notes = mergeInternalComment(split.publicNotes, split.internalComment);

      const payload = buildCandidatePatchPayload(currentCandidate, {
        notes,
        source: pipeline
      });

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось сохранить этап');
        return;
      }

      await load();
    }

    window.quickUpdateStatus = quickUpdateStatus;
    window.saveNotes = saveNotes;
    window.saveInternalComment = saveInternalComment;
    window.savePipeline = savePipeline;
    window.generateCandidateReport = generateCandidateReport;
    window.copyCandidateReport = copyCandidateReport;

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        generateCandidateReport();
      }, 250);
    });

    load().catch(err => {
      console.error(err);
      leftCol.innerHTML = '<div class="empty">Ошибка загрузки кандидата</div>';
      rightCol.innerHTML = '';
    });
  </script>
  <script>
    (function () {
      const toggle = document.getElementById('mobileNavToggle');
      const backdrop = document.getElementById('mobileNavBackdrop');
      const closeMobileNav = () => document.body.classList.remove('nav-open');
      const toggleMobileNav = () => document.body.classList.toggle('nav-open');

      toggle?.addEventListener('click', toggleMobileNav);
      backdrop?.addEventListener('click', closeMobileNav);
      document.querySelectorAll('.sidebar .nav-item').forEach(link => link.addEventListener('click', closeMobileNav));
      window.addEventListener('resize', () => {
        if (window.innerWidth > 920) closeMobileNav();
      });
    })();
  </script>
</body>
</html>
