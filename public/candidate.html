<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllStars — Кандидат</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0d0f14;
      --surface:#141720;
      --surface2:#1b1f2c;
      --surface3:#232840;
      --border:rgba(255,255,255,.07);
      --border2:rgba(255,255,255,.12);
      --accent:#4f6ef7;
      --accent2:#7d95ff;
      --accent-bg:rgba(79,110,247,.12);
      --accent-border:rgba(79,110,247,.32);
      --text:#e8eaf0;
      --text2:#9ba3bd;
      --text3:#58607c;
      --green:#34d399;
      --green-bg:rgba(52,211,153,.10);
      --green-border:rgba(52,211,153,.22);
      --yellow:#fbbf24;
      --yellow-bg:rgba(251,191,36,.10);
      --yellow-border:rgba(251,191,36,.22);
      --red:#f87171;
      --red-bg:rgba(248,113,113,.10);
      --red-border:rgba(248,113,113,.22);
      --purple:#a78bfa;
      --purple-bg:rgba(167,139,250,.10);
      --purple-border:rgba(167,139,250,.22);
      --shadow:0 10px 40px rgba(0,0,0,.24);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Manrope',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    .layout{display:flex;min-height:100vh}

    .sidebar{
      width:230px;
      flex-shrink:0;
      position:fixed;
      left:0;top:0;bottom:0;
      background:var(--surface);
      border-right:1px solid var(--border);
      padding:1.2rem 0 1.5rem;
      overflow-y:auto;
      z-index:10;
    }

    .sidebar-logo{
      padding:0 1rem 1.15rem;
      border-bottom:1px solid var(--border);
      margin-bottom:.7rem;
    }

    .brand{font-size:16px;font-weight:800;color:var(--text)}
    .sub{font-size:11px;color:var(--text3);margin-top:3px}

    .sidebar-section{
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--text3);
      padding:.45rem 1rem .25rem;
    }

    .nav-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 1rem;
      text-decoration:none;
      color:var(--text2);
      font-size:12px;
      border-left:2px solid transparent;
      transition:.15s;
    }

    .nav-item:hover{color:var(--text);background:rgba(255,255,255,.03)}
    .nav-item.active{color:var(--accent2);border-left-color:var(--accent);background:var(--accent-bg)}

    .main{
      margin-left:230px;
      width:100%;
      padding:1.6rem 1.6rem 3rem;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:1rem;
    }

    .title h1{
      font-size:30px;
      font-weight:800;
      line-height:1.1;
      letter-spacing:-.03em;
    }

    .title p{
      color:var(--text2);
      margin-top:6px;
      font-size:13px;
    }

    .quick-edit{
      margin-top:1rem;
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem .9rem;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .quick-edit label{
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .quick-edit select{
      width:100%;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      font-family:'Manrope',sans-serif;
    }

    .quick-edit-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .editor-box{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem 1rem;
      margin-top:1rem;
    }

    .editor-box label{
      display:block;
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      margin-bottom:6px;
    }

    .editor-box textarea{
      width:100%;
      min-height:180px;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      line-height:1.6;
      resize:vertical;
      font-family:'Manrope',sans-serif;
    }

    .editor-actions{
      display:flex;
      gap:8px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .comment-box{
      background:rgba(167,139,250,.08);
      border:1px solid var(--purple-border);
      border-radius:14px;
      padding:.9rem 1rem;
      margin-top:1rem;
    }

    .comment-box label{
      display:block;
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      margin-bottom:6px;
    }

    .comment-box textarea{
      width:100%;
      min-height:120px;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      line-height:1.6;
      resize:vertical;
      font-family:'Manrope',sans-serif;
    }

    .pipeline-box{
      margin-top:1rem;
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem .9rem;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .pipeline-box label{
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .pipeline-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    .pipeline-select{
      width:100%;
      background:none;
      border:none;
      outline:none;
      color:var(--text);
      font-size:14px;
      font-family:'Manrope',sans-serif;
    }

    .pipeline-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:4px 9px;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
    }

    .btns{display:flex;gap:8px;flex-wrap:wrap}

    .btn{
      border:none;
      cursor:pointer;
      font-family:'Manrope',sans-serif;
      font-weight:700;
      font-size:13px;
      border-radius:12px;
      padding:.78rem 1rem;
      transition:.15s;
    }

    .btn-primary{
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
    }

    .btn-ghost{
      background:var(--surface2);
      border:1px solid var(--border);
      color:var(--text2);
    }

    .wrap{
      display:grid;
      grid-template-columns:380px minmax(0,1fr);
      gap:16px;
      align-items:start;
    }

    .card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card-body{padding:1rem}

    .avatar-row{
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-bottom:1rem;
    }

    .avatar{
      width:52px;height:52px;border-radius:50%;
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:16px;flex-shrink:0;
    }

    .name{
      font-size:20px;
      font-weight:800;
      line-height:1.2;
    }

    .tg{
      color:var(--accent2);
      font-size:13px;
      margin-top:4px;
      word-break:break-word;
    }

    .sub{
      color:var(--text3);
      font-size:12px;
      margin-top:5px;
    }

    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:4px 9px;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
    }

    .badge.blue{background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent2)}
    .badge.green{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
    .badge.yellow{background:var(--yellow-bg);border:1px solid var(--yellow-border);color:var(--yellow)}
    .badge.red{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
    .badge.purple{background:var(--purple-bg);border:1px solid var(--purple-border);color:var(--purple)}

    .score-box{
      margin-top:1rem;
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem 1rem;
    }

    .score-label{
      font-size:11px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .score{
      font-size:30px;
      font-weight:800;
      margin-top:4px;
    }

    .score span{
      font-size:14px;
      color:var(--text2);
      font-weight:500;
    }

    .field-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:1rem;
    }

    .field-box{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.75rem .85rem;
    }

    .field-box .k{
      font-size:10px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      margin-bottom:5px;
    }

    .field-box .v{
      font-size:13px;
      line-height:1.5;
      word-break:break-word;
    }

    .section{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
      margin-bottom:16px;
    }

    .section-title{
      font-size:17px;
      font-weight:800;
      margin-bottom:.9rem;
      letter-spacing:-.02em;
    }

    .notes-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .note-box{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.8rem .9rem;
    }

    .note-title{
      font-size:12px;
      font-weight:800;
      color:var(--accent2);
      margin-bottom:6px;
    }

    .note-text{
      font-size:13px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .plain{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.8rem .9rem;
      font-size:13px;
      line-height:1.6;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .ai-box{
      background:linear-gradient(180deg, rgba(79,110,247,.10), rgba(79,110,247,.05));
      border:1px solid var(--accent-border);
      border-radius:14px;
      padding:.9rem 1rem;
    }

    .ai-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:.8rem;
    }

    .ai-title{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      color:var(--accent2);
    }

    .ai-summary{
      font-size:13px;
      line-height:1.6;
      margin-bottom:.8rem;
    }

    .ai-cols{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .ai-list{
      background:rgba(255,255,255,.03);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.75rem .8rem;
    }

    .ai-list-title{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
      color:var(--text3);
      margin-bottom:6px;
    }

    .ai-list ul{
      padding-left:16px;
      display:flex;
      flex-direction:column;
      gap:5px;
    }

    .ai-list li{
      font-size:13px;
      line-height:1.5;
    }

    .history{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .history-item{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:12px;
      padding:.75rem .85rem;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .history-left{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    .muted{
      color:var(--text3);
      font-size:12px;
    }

    .empty{
      color:var(--text3);
      background:var(--surface3);
      border:1px dashed var(--border2);
      border-radius:12px;
      padding:1rem;
    }

    .panel{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      padding:1rem;
      margin-top:1rem;
    }

    .panel-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .panel-title h2{
      font-size:17px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .panel-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    #teamlead-handoff{
      width: 100%;
      min-height: 180px;
      resize: vertical;
    }

    @media (max-width: 1100px){
      .wrap{
        grid-template-columns:1fr;
      }
    }

    @media (max-width: 920px){
      .sidebar{display:none}
      .main{margin-left:0;padding:1rem}
      .notes-grid,.ai-cols{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="brand">AllStars</div>
        <div class="sub">Карточка кандидата</div>
      </div>

      <div class="sidebar-section">Навигация</div>
      <a class="nav-item" href="/index.html">🧑‍💼 Новый кандидат</a>
      <a class="nav-item active" href="/candidates.html">👥 Кандидаты</a>
      <a class="nav-item" href="/interviews.html">📞 Собеседования</a>
      <a class="nav-item" href="/dashboard.html">📊 Dashboard</a>
      <a class="nav-item" href="/team-dashboard.html">🫂 Действующие</a>
      <a class="nav-item" href="/hr-needs.html">🎯 Потребности HR</a>
      <a class="nav-item" href="/team.html">👥 Команда</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="title">
          <h1 id="pageTitle">Кандидат</h1>
          <p id="pageSub">Загружаем данные...</p>
        </div>

        <div class="btns">
          <button class="btn btn-ghost" onclick="location.href='/candidates.html'">Назад к базе</button>
        </div>
      </div>

      <div class="wrap">
        <div id="leftCol"></div>
        <div id="rightCol"></div>
      </div>
    </main>
  </div>

  <script>
    const tokenKey = 'allstars_token';
    const token = localStorage.getItem(tokenKey);
    if (!token) location.href = '/login.html';

    const params = new URLSearchParams(location.search);
    const candidateId = params.get('id');

    const leftCol = document.getElementById('leftCol');
    const rightCol = document.getElementById('rightCol');
    let currentCandidate = null;

    function api(path, options = {}) {
      return fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
    }

    async function generateCandidateAISummary() {
      console.log('generateCandidateAISummary clicked');

      if (!currentCandidate) {
        alert('Кандидат ещё не загружен');
        return;
      }

      const notesEl =
        document.querySelector('#candidate-notes') ||
        document.querySelector('#edit-notes') ||
        document.querySelector('#notes') ||
        document.querySelector('textarea[name="notes"]');

      const notes = notesEl?.value?.trim() || currentCandidate.notes || '';
      const status = currentCandidate.status || '';

      console.log('AI summary payload source', {
        notes,
        status,
        currentCandidate
      });

      if (!notes) {
        alert('Сначала добавь заметки по кандидату');
        return;
      }

      const payload = {
        notes,
        status,
        candidate: {
          name: currentCandidate.name || '',
          age: currentCandidate.age || '',
          tg: currentCandidate.tg || '',
          exp: currentCandidate.exp || '',
          avgcheck: currentCandidate.avg_check || '',
          top: currentCandidate.top_pages || '',
          job: currentCandidate.occupation || '',
          english: currentCandidate.english || '',
          platforms: currentCandidate.platforms || '',
          shifts: currentCandidate.shifts || '',
          schedule: currentCandidate.schedule || ''
        }
      };

      try {
        console.log('sending /api/ai/summary', payload);

        const res = await api('/api/ai/summary', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        console.log('/api/ai/summary response', res.status, data);

        if (!res.ok) {
          alert(data.error || 'Ошибка генерации summary');
          return;
        }

        if (notesEl) {
          notesEl.value = data.summary || notes;
        } else {
          alert('Не найдено поле заметок для вставки результата');
        }
      } catch (err) {
        console.error('generateCandidateAISummary failed', err);
        alert('Ошибка генерации summary');
      }
    }

    async function generateCandidateTeamleadHandoff() {
      console.log('generateCandidateTeamleadHandoff clicked');

      if (!currentCandidate) {
        alert('Кандидат ещё не загружен');
        return;
      }

      const notesEl =
        document.querySelector('#candidate-notes') ||
        document.querySelector('#edit-notes') ||
        document.querySelector('#notes') ||
        document.querySelector('textarea[name="notes"]');

      const handoffEl = document.getElementById('teamlead-handoff');

      const notes = notesEl?.value?.trim() || currentCandidate.notes || '';
      const status = currentCandidate.status || '';

      console.log('AI handoff payload source', {
        notes,
        status,
        currentCandidate,
        handoffElExists: !!handoffEl
      });

      if (!notes) {
        alert('Сначала добавь заметки по кандидату');
        return;
      }

      if (!handoffEl) {
        alert('Не найдено поле "Передача тимлиду"');
        return;
      }

      const payload = {
        notes,
        status,
        candidate: {
          name: currentCandidate.name || '',
          age: currentCandidate.age || '',
          tg: currentCandidate.tg || '',
          exp: currentCandidate.exp || '',
          avgcheck: currentCandidate.avg_check || '',
          top: currentCandidate.top_pages || '',
          job: currentCandidate.occupation || '',
          english: currentCandidate.english || '',
          platforms: currentCandidate.platforms || '',
          shifts: currentCandidate.shifts || '',
          schedule: currentCandidate.schedule || ''
        }
      };

      try {
        console.log('sending /api/ai/teamlead-handoff', payload);

        const res = await api('/api/ai/teamlead-handoff', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        console.log('/api/ai/teamlead-handoff response', res.status, data);

        if (!res.ok) {
          alert(data.error || 'Ошибка генерации передачи');
          return;
        }

        handoffEl.value = data.summary || '';
      } catch (err) {
        console.error('generateCandidateTeamleadHandoff failed', err);
        alert('Ошибка генерации передачи');
      }
    }

    function copyTeamleadHandoff() {
      const handoffEl = document.getElementById('teamlead-handoff');
      if (handoffEl && handoffEl.value) {
        navigator.clipboard.writeText(handoffEl.value).then(() => {
          alert('Передача скопирована!');
        }).catch(() => {
          alert('Не удалось скопировать');
        });
      } else {
        alert('Сначала сгенерируйте передачу');
      }
    }

    // Expose functions to global scope for onclick handlers
    window.generateCandidateAISummary = generateCandidateAISummary;
    window.generateCandidateTeamleadHandoff = generateCandidateTeamleadHandoff;
    window.copyTeamleadHandoff = copyTeamleadHandoff;

    function escapeHtml(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function initials(name = '') {
      return name.trim().split(/\s+/).map(x => x[0]).join('').slice(0,2).toUpperCase() || '?';
    }

    function formatDate(date) {
      if (!date) return '—';
      const d = new Date(date);
      return d.toLocaleString('ru-RU', {
        day:'2-digit',
        month:'2-digit',
        year:'numeric',
        hour:'2-digit',
        minute:'2-digit'
      });
    }

    function verdictMeta(total) {
      if (total >= 40) return { label:'Берём', cls:'green' };
      if (total >= 28) return { label:'Думаем', cls:'yellow' };
      if (total > 0) return { label:'Отказ', cls:'red' };
      return { label:'Без оценки', cls:'blue' };
    }

    function statusMeta(status) {
      if (status === 'Принят') return 'green';
      if (status === 'Тест-смена') return 'purple';
      if (status === 'Изучает гайд') return 'yellow';
      if (status === 'Отказ') return 'red';
      return 'blue';
    }

    function pipelineLabel(value = '') {
      const map = {
        new: 'Новый',
        screening: 'Скрининг',
        interview: 'Интервью',
        test_task: 'Тестовое',
        test_shift: 'Тест-смена',
        hired: 'Нанят',
        rejected: 'Отказ'
      };
      return map[value] || 'Не задан';
    }

    function parseStructuredNotes(notes = '') {
      const raw = String(notes || '').trim();
      if (!raw) return { intro:'', sections:[], plain:'' };

      const divider = '────────────';
      const parts = raw.split(divider).map(x => x.trim()).filter(Boolean);

      let intro = '';
      let structuredText = raw;

      if (parts.length >= 2) {
        intro = parts[0];
        structuredText = parts.slice(1).join('\n\n');
      }

      const chunks = structuredText.split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
      const sections = [];
      const plain = [];

      for (const chunk of chunks) {
        const idx = chunk.indexOf(':');
        if (idx > 0 && idx < 60) {
          const title = chunk.slice(0, idx).trim();
          const text = chunk.slice(idx + 1).trim();

          const looksStructured = /опыт|платформы|метрики|ожидания|сигналы|мотивация|кейс|ошибки|стресс|следующий шаг|итог|фидбэк|фишки|апсейл|занятость|фон/i.test(title);

          if (looksStructured) {
            sections.push({ title, text });
          } else {
            plain.push(chunk);
          }
        } else {
          plain.push(chunk);
        }
      }

      return {
        intro,
        sections,
        plain: plain.join('\n\n')
      };
    }

    function splitInternalComment(notes = '') {
      const raw = String(notes || '');
      const marker = '\n\n[INTERNAL_COMMENT]\n';
      const index = raw.indexOf(marker);

      if (index === -1) {
        return {
          publicNotes: raw.trim(),
          internalComment: ''
        };
      }

      return {
        publicNotes: raw.slice(0, index).trim(),
        internalComment: raw.slice(index + marker.length).trim()
      };
    }

    function mergeInternalComment(publicNotes = '', internalComment = '') {
      const cleanPublic = String(publicNotes || '').trim();
      const cleanInternal = String(internalComment || '').trim();

      if (!cleanInternal) return cleanPublic;
      if (!cleanPublic) return `[INTERNAL_COMMENT]\n${cleanInternal}`;

      return `${cleanPublic}\n\n[INTERNAL_COMMENT]\n${cleanInternal}`;
    }

    function renderNotes(notes) {
      const split = splitInternalComment(notes);
      const parsed = parseStructuredNotes(split.publicNotes);

      let html = '';

      if (parsed.intro) {
        html += `
          <div class="note-box">
            <div class="note-title">Итог HR</div>
            <div class="note-text">${escapeHtml(parsed.intro)}</div>
          </div>
        `;
      }

      if (parsed.sections.length) {
        html += `<div class="notes-grid">`;
        html += parsed.sections.map(s => `
          <div class="note-box">
            <div class="note-title">${escapeHtml(s.title)}</div>
            <div class="note-text">${escapeHtml(s.text)}</div>
          </div>
        `).join('');
        html += `</div>`;
      }

      if (parsed.plain) {
        html += `<div class="plain">${escapeHtml(parsed.plain)}</div>`;
      }

      if (!html) {
        html = `<div class="empty">Нет заметок</div>`;
      }

      return html;
    }

      rightCol.innerHTML = html;
    }

    async function load() {
      if (!candidateId) {
        document.getElementById('pageSub').textContent = 'Не передан id кандидата';
        leftCol.innerHTML = '<div class="empty">Не передан id кандидата</div>';
        return;
      }

      const res = await api('/candidates');
      if (!res.ok) throw new Error('Не удалось загрузить кандидатов');
      const candidates = await res.json();
      const candidate = candidates.find(x => String(x.id) === String(candidateId));
      currentCandidate = candidate;
      console.log('currentCandidate loaded', currentCandidate);

      if (!candidate) {
        document.getElementById('pageSub').textContent = 'Кандидат не найден';
        leftCol.innerHTML = '<div class="empty">Кандидат не найден</div>';
        return;
      }

      document.getElementById('pageTitle').textContent = candidate.name || 'Кандидат';
      document.getElementById('pageSub').textContent = `Статус: ${candidate.status || 'Без статуса'} · Балл: ${candidate.total || 0}/50`;

      let historyData = null;
      try {
        const historyRes = await api(`/candidates/${candidateId}/history`);
        if (historyRes.ok) historyData = await historyRes.json();
      } catch {}

      renderLeft(candidate);
      renderRight(candidate, historyData);
    }

    async function quickUpdateStatus() {
      if (!currentCandidate) return;

      const status = document.getElementById('quick-status')?.value || '';

      const payload = {
        fields: {
          name: currentCandidate.name || '',
          tg: currentCandidate.tg || '',
          age: currentCandidate.age || '',
          english: currentCandidate.english || '',
          exp: currentCandidate.exp || '',
          platforms: currentCandidate.platforms || '',
          shift: currentCandidate.shift || '',
          schedule: currentCandidate.schedule || '',
          top: currentCandidate.top_pages || '',
          avgcheck: currentCandidate.avg_check || '',
          job: currentCandidate.job || '',
          status,
          notes: currentCandidate.notes || '',
          source: currentCandidate.source || ''
        },
        ratings: currentCandidate.ratings || {},
        total: currentCandidate.total || 0
      };

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось обновить статус');
        return;
      }

      await load();
    }

          tg: currentCandidate.tg || '',
          age: currentCandidate.age || '',
          english: currentCandidate.english || '',
          exp: currentCandidate.exp || '',
          platforms: currentCandidate.platforms || '',
          shift: currentCandidate.shift || '',
          schedule: currentCandidate.schedule || '',
          top: currentCandidate.top_pages || '',
          avgcheck: currentCandidate.avg_check || '',
          job: currentCandidate.job || '',
          status: currentCandidate.status || '',
          notes,
          source: currentCandidate.source || ''
        },
        ratings: currentCandidate.ratings || {},
        total: currentCandidate.total || 0
      };

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось сохранить заметки');
        return;
      }

      await load();
    }

    async function saveInternalComment() {
      if (!currentCandidate) return;

      const publicNotes = document.getElementById('notes-editor')?.value || '';
      const internalComment = document.getElementById('internal-comment-editor')?.value || '';
      const mergedNotes = mergeInternalComment(publicNotes, internalComment);

      const payload = {
        fields: {
          name: currentCandidate.name || '',
          tg: currentCandidate.tg || '',
          age: currentCandidate.age || '',
          english: currentCandidate.english || '',
          exp: currentCandidate.exp || '',
          platforms: currentCandidate.platforms || '',
          shift: currentCandidate.shift || '',
          schedule: currentCandidate.schedule || '',
          top: currentCandidate.top_pages || '',
          avgcheck: currentCandidate.avg_check || '',
          job: currentCandidate.job || '',
          status: currentCandidate.status || '',
          notes: mergedNotes,
          source: currentCandidate.source || ''
        },
        ratings: currentCandidate.ratings || {},
        total: currentCandidate.total || 0
      };

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось сохранить комментарий');
        return;
      }

      await load();
    }

    async function savePipeline() {
      if (!currentCandidate) return;

      const pipeline = document.getElementById('quick-pipeline')?.value || '';

      const split = splitInternalComment(currentCandidate.notes || '');
      const notes = mergeInternalComment(split.publicNotes, split.internalComment);

      const payload = {
        fields: {
          name: currentCandidate.name || '',
          tg: currentCandidate.tg || '',
          age: currentCandidate.age || '',
          english: currentCandidate.english || '',
          exp: currentCandidate.exp || '',
          platforms: currentCandidate.platforms || '',
          shift: currentCandidate.shift || '',
          schedule: currentCandidate.schedule || '',
          top: currentCandidate.top_pages || '',
          avgcheck: currentCandidate.avg_check || '',
          job: currentCandidate.job || '',
          status: currentCandidate.status || '',
          notes,
          source: pipeline
        },
        ratings: currentCandidate.ratings || {},
        total: currentCandidate.total || 0
      };

      const res = await api(`/candidates/${candidateId}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Не удалось сохранить этап');
        return;
      }

      await load();
    }

    window.quickUpdateStatus = quickUpdateStatus;
    window.saveNotes = saveNotes;
    window.saveInternalComment = saveInternalComment;
    window.savePipeline = savePipeline;

    load().catch(err => {
      console.error(err);
      leftCol.innerHTML = '<div class="empty">Ошибка загрузки кандидата</div>';
      rightCol.innerHTML = '';
    });
  </script>
