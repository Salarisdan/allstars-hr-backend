<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllStars — Действующие</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0d0f14;
      --surface:#141720;
      --surface2:#1b1f2c;
      --surface3:#232840;
      --border:rgba(255,255,255,.07);
      --accent:#4f6ef7;
      --accent2:#7d95ff;
      --accent-bg:rgba(79,110,247,.12);
      --accent-border:rgba(79,110,247,.32);
      --text:#e8eaf0;
      --text2:#9ba3bd;
      --text3:#58607c;
      --shadow:0 10px 40px rgba(0,0,0,.24);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:'Manrope',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    .layout{
      display:flex;
      min-height:100vh;
    }

    .sidebar{
      width:230px;
      flex-shrink:0;
      position:fixed;
      left:0;
      top:0;
      bottom:0;
      background:var(--surface);
      border-right:1px solid var(--border);
      padding:1.2rem 0 1.5rem;
      overflow-y:auto;
      z-index:10;
    }

    .sidebar-logo{
      padding:0 1rem 1.15rem;
      border-bottom:1px solid var(--border);
      margin-bottom:.7rem;
    }

    .brand{
      font-size:16px;
      font-weight:800;
      color:var(--text);
    }

    .sub{
      font-size:11px;
      color:var(--text3);
      margin-top:3px;
    }

    .sidebar-section{
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--text3);
      padding:.45rem 1rem .25rem;
    }

    .nav-item{
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 1rem;
      text-decoration:none;
      color:var(--text2);
      font-size:12px;
      border-left:2px solid transparent;
      transition:.15s;
    }

    .nav-item:hover{
      color:var(--text);
      background:rgba(255,255,255,.03);
    }

    .nav-item.active{
      color:var(--accent2);
      border-left-color:var(--accent);
      background:var(--accent-bg);
    }

    .main{
      margin-left:230px;
      width:100%;
      padding:1.6rem 1.6rem 3rem;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:1rem;
    }

    .title h1{
      font-size:30px;
      font-weight:800;
      line-height:1.1;
      letter-spacing:-.03em;
    }

    .title p{
      color:var(--text2);
      margin-top:6px;
      font-size:13px;
    }

    .btn{
      border:none;
      cursor:pointer;
      font-family:'Manrope',sans-serif;
      font-weight:700;
      font-size:13px;
      border-radius:12px;
      padding:.78rem 1rem;
      background:var(--accent-bg);
      border:1px solid var(--accent-border);
      color:var(--accent2);
    }

    .hero-stats{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:18px;
    }

    .stat-card,
    .summary-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
    }

    .stat-value{
      font-size:30px;
      font-weight:800;
      line-height:1;
    }

    .stat-label{
      margin-top:8px;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text3);
      font-weight:800;
    }

    .summary-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .summary-list{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
    }

    .summary-item{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.85rem .9rem;
    }

    .summary-item .k{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text3);
      font-weight:800;
      margin-bottom:5px;
    }

    .summary-item .v{
      font-size:15px;
      font-weight:700;
    }

    .loading,
    .error-box{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      padding:1.1rem 1rem;
      color:var(--text2);
    }

    .error-box{
      color:#f87171;
    }

    @media (max-width:1100px){
      .hero-stats,
      .summary-list{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:920px){
      .sidebar{display:none}
      .main{margin-left:0;padding:1rem}
      .hero-stats,
      .summary-list{
        grid-template-columns:1fr;
      }
    }

    .details-card{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:1rem;
      margin-top:18px;
    }

    .details-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .details-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
    }

    .detail-item{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem;
    }

    .detail-name{
      font-size:13px;
      font-weight:800;
      margin-bottom:8px;
    }

    .detail-meta{
      color:var(--text2);
      font-size:12px;
    }

    @media (max-width:1100px){
      .details-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:920px){
      .details-grid{
        grid-template-columns:1fr;
      }
    }

    .detail-item{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:16px;
      padding:1rem;
      min-height:110px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition:.15s ease;
    }

    .detail-item:hover{
      transform:translateY(-2px);
      border-color:rgba(255,255,255,.14);
    }

    .detail-top{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .detail-dot{
      width:10px;
      height:10px;
      border-radius:999px;
      flex-shrink:0;
      background:rgba(255,255,255,.25);
    }

    .detail-name{
      font-size:14px;
      font-weight:800;
      line-height:1.2;
    }

    .detail-count{
      font-size:28px;
      font-weight:800;
      line-height:1;
      margin-top:10px;
    }

    .detail-meta{
      color:var(--text3);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:700;
      margin-top:8px;
    }

    .status-green{
      border-color:rgba(34,197,94,0.28);
      background:rgba(34,197,94,0.08);
    }

    .status-green .detail-dot{
      background:#22c55e;
    }

    .status-red{
      border-color:rgba(239,68,68,0.28);
      background:rgba(239,68,68,0.08);
    }

    .status-red .detail-dot{
      background:#ef4444;
    }

    .status-yellow{
      border-color:rgba(234,179,8,0.28);
      background:rgba(234,179,8,0.08);
    }

    .status-yellow .detail-dot{
      background:#eab308;
    }

    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(10,12,18,.75);
      backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:1000;
      padding:24px;
    }

    .modal-overlay.show{
      display:flex;
    }

    .modal-sheet{
      width:min(980px, 100%);
      max-height:85vh;
      background:linear-gradient(180deg,#1b1f2c,#141720);
      border:1px solid var(--border);
      border-radius:22px;
      box-shadow:0 20px 80px rgba(0,0,0,.6);
      overflow:hidden;
      animation:fadeScaleIn .22s ease;
    }

    @keyframes fadeScaleIn{
      from{transform:translateY(8px) scale(.985);opacity:0}
      to{transform:translateY(0) scale(1);opacity:1}
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:1rem;
      border-bottom:1px solid var(--border);
    }

    .modal-title{
      font-size:18px;
      font-weight:800;
    }

    .modal-close{
      border:none;
      background:var(--surface3);
      border:1px solid var(--border);
      color:var(--text2);
      padding:.5rem .75rem;
      border-radius:10px;
      cursor:pointer;
    }

    .modal-body{
      padding:1rem;
      overflow:auto;
      max-height:calc(85vh - 70px);
    }

    .member-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .member-card{
      background:linear-gradient(180deg,#232840,#1b1f2c);
      border:1px solid var(--border);
      border-radius:16px;
      padding:1rem;
      transition:.2s ease;
      cursor:pointer;
    }

    .member-card:hover{
      transform:translateY(-3px);
      border-color:rgba(255,255,255,.15);
    }

    .member-card.platform-onlyfans{
      border-color: rgba(79,110,247,.35);
      background: linear-gradient(180deg, rgba(79,110,247,.10), rgba(27,31,44,1));
      box-shadow: inset 0 0 0 1px rgba(79,110,247,.12);
    }

    .member-card.platform-fansly{
      border-color: rgba(168,85,247,.35);
      background: linear-gradient(180deg, rgba(168,85,247,.10), rgba(27,31,44,1));
      box-shadow: inset 0 0 0 1px rgba(168,85,247,.12);
    }

    .member-name{
      font-size:15px;
      font-weight:800;
      margin-bottom:10px;
    }

    .member-meta{
      display:flex;
      flex-direction:column;
      gap:6px;
      font-size:12px;
      color:var(--text2);
    }

    .member-row{
      display:flex;
      justify-content:space-between;
      gap:8px;
    }

    .member-label{
      color:var(--text3);
    }

    .member-value{
      font-weight:600;
    }

    .badge-platform{
      display:inline-block;
      padding:3px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      margin-left:8px;
      vertical-align:middle;
    }

    .badge-of{
      background:rgba(79,110,247,.18);
      color:#7d95ff;
      border:1px solid rgba(79,110,247,.35);
    }

    .badge-fansly{
      background:rgba(168,85,247,.18);
      color:#c084fc;
      border:1px solid rgba(168,85,247,.35);
    }

    .editor-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .editor-field{
      background:var(--surface3);
      border:1px solid var(--border);
      border-radius:14px;
      padding:.9rem;
    }

    .editor-label{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text3);
      font-weight:800;
      margin-bottom:8px;
    }

    .editor-input,
    .editor-textarea{
      width:100%;
      background:#0f1220;
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text);
      padding:.7rem .8rem;
      font-family:'Manrope',sans-serif;
      font-size:13px;
      outline:none;
    }

    .editor-textarea{
      min-height:120px;
      resize:vertical;
    }

    .editor-select{
      width:100%;
      background:#0f1220;
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text);
      padding:.7rem .8rem;
      font-family:'Manrope',sans-serif;
      font-size:13px;
      outline:none;
    }

    .editor-dropdown{
      position:relative;
    }

    .editor-dropdown-btn{
      width:100%;
      background:#0f1220;
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text);
      padding:.75rem .9rem;
      font-family:'Manrope',sans-serif;
      font-size:13px;
      outline:none;
      cursor:pointer;
      text-align:left;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .editor-dropdown-btn::after{
      content:'▾';
      color:var(--text3);
      font-size:12px;
    }

    .editor-dropdown-menu{
      position:absolute;
      top:calc(100% + 6px);
      left:0;
      right:0;
      z-index:30;
      background:#171b28;
      border:1px solid var(--border);
      border-radius:12px;
      box-shadow:0 16px 40px rgba(0,0,0,.4);
      padding:8px;
      display:none;
      max-height:260px;
      overflow:auto;
    }

    .editor-dropdown.open .editor-dropdown-menu{
      display:block;
    }

    .editor-option{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:8px 10px;
      border-radius:10px;
      cursor:pointer;
      color:var(--text2);
      font-size:13px;
      transition:.12s;
    }

    .editor-option:hover{
      background:rgba(255,255,255,.04);
      color:var(--text);
    }

    .editor-option.active{
      background:rgba(79,110,247,.12);
      color:var(--accent2);
    }

    .editor-option-check{
      color:var(--accent2);
      font-size:12px;
      visibility:hidden;
    }

    .editor-option.active .editor-option-check{
      visibility:visible;
    }

    .editor-chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      border:1px solid transparent;
    }

    .chip-green{
      background:rgba(34,197,94,.15);
      color:#86efac;
      border-color:rgba(34,197,94,.25);
    }

    .chip-red{
      background:rgba(239,68,68,.15);
      color:#fca5a5;
      border-color:rgba(239,68,68,.25);
    }

    .chip-yellow{
      background:rgba(234,179,8,.15);
      color:#fde68a;
      border-color:rgba(234,179,8,.25);
    }

    .chip-blue{
      background:rgba(79,110,247,.15);
      color:#9db2ff;
      border-color:rgba(79,110,247,.25);
    }

    .chip-purple{
      background:rgba(168,85,247,.15);
      color:#d8b4fe;
      border-color:rgba(168,85,247,.25);
    }

    .chip-neutral{
      background:rgba(255,255,255,.06);
      color:var(--text2);
      border-color:rgba(255,255,255,.1);
    }

    .editor-checkbox-wrap{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#0f1220;
      border:1px solid var(--border);
      border-radius:10px;
      padding:.75rem .9rem;
      min-height:44px;
    }

    .editor-checkbox-label{
      color:var(--text2);
      font-size:13px;
      font-weight:600;
    }

    .editor-checkbox{
      width:18px;
      height:18px;
      accent-color:#4f6ef7;
      cursor:pointer;
    }

    .editor-field.full{
      grid-column:1 / -1;
    }

    @media (max-width:920px){
      .editor-grid{
        grid-template-columns:1fr;
      }
    }

    .detail-item.clickable{
      cursor:pointer;
    }

    .detail-item.clickable:hover{
      transform:translateY(-2px);
    }

    .modal-toolbar{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    .modal-search{
      flex:1;
      min-width:240px;
      background:var(--surface3);
      border:1px solid var(--border);
      color:var(--text);
      border-radius:12px;
      padding:.75rem .9rem;
      font-family:'Manrope',sans-serif;
      outline:none;
    }

    .modal-search::placeholder{
      color:var(--text3);
    }

    .modal-toolbar-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .modal-btn{
      border:none;
      background:var(--surface3);
      border:1px solid var(--border);
      color:var(--text2);
      padding:.7rem .9rem;
      border-radius:10px;
      cursor:pointer;
      font-family:'Manrope',sans-serif;
      font-weight:700;
      font-size:12px;
      transition:.15s;
    }

    .modal-btn:hover{
      color:var(--text);
      border-color:rgba(255,255,255,.16);
    }

    .modal-meta-line{
      color:var(--text3);
      font-size:12px;
      margin-bottom:8px;
    }

    .modal-empty{
      color:var(--text3);
      padding:.5rem 0;
    }

    @media (max-width:900px){
      .member-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="brand">AllStars</div>
        <div class="sub">Действующие</div>
      </div>

      <div class="sidebar-section">Навигация</div>
      <a class="nav-item" href="/index.html">🧑‍💼 Новый кандидат</a>
      <a class="nav-item" href="/candidates.html">👥 Кандидаты</a>
      <a class="nav-item" href="/interviews.html">📞 Собеседования</a>
      <a class="nav-item" href="/dashboard.html">📊 Dashboard</a>
      <a class="nav-item active" href="/team-dashboard.html">🫂 Действующие</a>
      <a class="nav-item" href="/team.html">🫂 Команда</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="title">
          <h1>Действующие</h1>
          <p>Операционная статистика по сотрудникам из отдельной таблицы.</p>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
          <select id="platformFilter" class="modal-btn" style="min-width:180px;">
            <option value="">Все платформы</option>
            <option value="onlyfans">OnlyFans</option>
            <option value="fansly">Fansly</option>
          </select>

          <button class="btn" id="addEmployeeBtn">Добавить сотрудника</button>
          <button class="btn" id="refreshBtn">Обновить</button>
        </div>
      </div>

      <div id="content">
        <div class="loading">Загружаем статистику...</div>
      </div>

      <div class="modal-overlay" id="statusModal" onclick="closeStatusModal(event)">
        <div class="modal-sheet">
          <div class="modal-head">
            <div class="modal-title" id="statusModalTitle">Список сотрудников</div>
            <button class="modal-close" type="button" onclick="forceCloseStatusModal()">Закрыть</button>
          </div>
          <div class="modal-body" id="statusModalBody">
            <div class="loading">Загружаем...</div>
          </div>
        </div>
      </div>

      <div class="modal-overlay" id="memberEditorOverlay" onclick="closeMemberEditor(event)">
        <div class="modal-sheet" style="width:min(1100px,100%); max-height:90vh;">
          <div class="modal-head">
            <div class="modal-title" id="memberEditorTitle">Карточка сотрудника</div>
            <button class="modal-close" type="button" onclick="forceCloseMemberEditor()">Закрыть</button>
          </div>
          <div class="modal-body">
            <div id="memberEditorContent">
              <div class="loading">Загружаем данные...</div>
            </div>
            <div style="display:flex; justify-content:flex-end; margin-top:14px; gap:10px;">
              <button class="modal-btn" type="button" onclick="saveMemberEditor()">Сохранить</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const tokenKey = 'allstars_token';
    const token = localStorage.getItem(tokenKey);

    if (!token) {
      location.href = '/login.html';
    }

    const content = document.getElementById('content');
    const refreshBtn = document.getElementById('refreshBtn');
    const platformFilter = document.getElementById('platformFilter');
    let currentTeamStatsData = null;

    function api(path, options = {}) {
      return fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function getStatusClass(name) {
      const s = String(name || '').toLowerCase();

      if (s.includes('работает')) return 'status-green';
      if (s.includes('уволен')) return 'status-red';
      if (s.includes('не рассчитан')) return 'status-yellow';

      return '';
    }

    function filterStatusesByPlatform(data) {
      const mode = String(platformFilter?.value || '').trim().toLowerCase();
      if (!mode) return data;

      const filteredStatuses = (data.statuses || []).filter(item => {
        const platform = String(item.platform || '').trim().toLowerCase();
        return platform.includes(mode);
      });

      return {
        ...data,
        statuses: filteredStatuses
      };
    }

    function renderTeamStats(data) {
      currentTeamStatsData = data;

      const filteredData = filterStatusesByPlatform(data);

      content.innerHTML = `
        <section class="hero-stats">
          <div class="stat-card">
            <div class="stat-value">${data.totals.total}</div>
            <div class="stat-label">Всего сотрудников</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${data.totals.active}</div>
            <div class="stat-label">Сейчас работает</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${data.totals.fired}</div>
            <div class="stat-label">Уволено</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${data.totals.unpaid}</div>
            <div class="stat-label">Не рассчитан</div>
          </div>
        </section>

        <section class="summary-card">
          <div class="summary-title">Платформы и средние показатели</div>
          <div class="summary-list">
            <div class="summary-item">
              <div class="k">OnlyFans</div>
              <div class="v">${data.totals.onlyfans}</div>
            </div>
            <div class="summary-item">
              <div class="k">Fansly</div>
              <div class="v">${data.totals.fansly}</div>
            </div>
            <div class="summary-item">
              <div class="k">Средний опыт, мес.</div>
              <div class="v">${data.averages.experience_months}</div>
            </div>
            <div class="summary-item">
              <div class="k">Средний срок работы, дни</div>
              <div class="v">${data.averages.work_days}</div>
            </div>
          </div>
        </section>

        <section class="details-card">
          <div class="details-title">Разбивка по текущим статусам</div>
          <div class="details-grid">
            ${(filteredData.statuses || []).map(item => `
              <div class="detail-item clickable ${getStatusClass(item.name)}" onclick="openStatusMembers('${String(item.name).replaceAll("'", "\\'")}')">
                <div class="detail-top">
                  <span class="detail-dot"></span>
                  <div class="detail-name">${escapeHtml(item.name)}</div>
                </div>
                <div class="detail-count">${item.count}</div>
                <div class="detail-meta">${item.platform ? `Платформа: ${item.platform}` : 'Статус сотрудников'}</div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    async function loadTeamStatsPage() {
      content.innerHTML = `<div class="loading">Загружаем статистику...</div>`;

      const res = await api('/api/team-stats');
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Не удалось загрузить статистику команды');
      }

      const data = await res.json();
      renderTeamStats(data);
    }

    refreshBtn.addEventListener('click', loadTeamStatsPage);

    platformFilter.addEventListener('change', () => {
      if (currentTeamStatsData) {
        renderTeamStats(currentTeamStatsData);
      }
    });

    loadTeamStatsPage().catch(err => {
      console.error(err);
      content.innerHTML = `<div class="error-box">${err.message || 'Ошибка загрузки статистики команды'}</div>`;
    });

    let currentStatusMembers = [];
    let currentStatusName = '';
    let filteredStatusMembers = [];
    let visibleStatusMembersCount = 40;
    const STATUS_MEMBERS_PAGE_SIZE = 40;
    window.__teamMemberSearchQuery = '';

    async function openStatusMembers(statusName) {
      const modal = document.getElementById('statusModal');
      const title = document.getElementById('statusModalTitle');
      const body = document.getElementById('statusModalBody');

      currentStatusName = statusName;
      currentStatusMembers = [];

      title.textContent = `Статус: ${statusName}`;
      body.innerHTML = `<div class="loading">Загружаем список...</div>`;
      modal.classList.add('show');

      const res = await api(`/api/team-status-members?status=${encodeURIComponent(statusName)}`);
      const data = await res.json().catch(() => []);

      if (!res.ok) {
        body.innerHTML = `<div class="error-box">Не удалось загрузить список</div>`;
        return;
      }

      currentStatusMembers = Array.isArray(data) ? data : [];
      filteredStatusMembers = [...currentStatusMembers];
      visibleStatusMembersCount = STATUS_MEMBERS_PAGE_SIZE;
      window.__teamMemberSearchQuery = '';
      renderStatusMembersList(filteredStatusMembers);
    }

    function getPlatformBadge(platformValue) {
      const platform = String(platformValue || '').toLowerCase();

      if (platform.includes('onlyfans')) {
        return `<span class="badge-platform badge-of">OnlyFans</span>`;
      }

      if (platform.includes('fansly')) {
        return `<span class="badge-platform badge-fansly">Fansly</span>`;
      }

      return '';
    }

    function renderStatusMembersList(list) {
      const body = document.getElementById('statusModalBody');
      if (!body) return;

      const safeList = Array.isArray(list) ? list : [];
      const visibleList = safeList.slice(0, visibleStatusMembersCount);
      const hasMore = safeList.length > visibleStatusMembersCount;

      if (!safeList.length) {
        body.innerHTML = `
          <div class="modal-toolbar">
            <input class="modal-search" id="memberSearchInput" placeholder="Поиск по имени или Telegram..." oninput="debouncedFilterStatusMembers()" />
            <div class="modal-toolbar-actions">
              <button class="modal-btn" type="button" onclick="copyStatusTelegrams()">Скопировать Telegram</button>
            </div>
          </div>
          <div class="modal-empty">По этому статусу никого не найдено</div>
        `;
        return;
      }

      body.innerHTML = `
        <div class="modal-toolbar">
          <input
            class="modal-search"
            id="memberSearchInput"
            placeholder="Поиск по имени или Telegram..."
            oninput="debouncedFilterStatusMembers()"
          />
          <div class="modal-toolbar-actions">
            <button class="modal-btn" type="button" onclick="copyStatusTelegrams()">Скопировать Telegram</button>
          </div>
        </div>

        <div class="modal-meta-line">
          Найдено: ${safeList.length} · Показано: ${visibleList.length}
        </div>

        <div class="member-grid">
          ${visibleList.map(person => {
            const platform = String(person.platform || '').toLowerCase();

            let platformBadge = '';
            let platformCardClass = '';

            if (platform.includes('onlyfans')) {
              platformBadge = `<span class="badge-platform badge-of">OnlyFans</span>`;
              platformCardClass = 'platform-onlyfans';
            } else if (platform.includes('fansly')) {
              platformBadge = `<span class="badge-platform badge-fansly">Fansly</span>`;
              platformCardClass = 'platform-fansly';
            }

            return `
              <div class="member-card ${platformCardClass}" onclick="openMemberEditor(${person.row_number})">
                <div class="member-name">
                  ${person.name || 'Без имени'}
                  ${platformBadge}
                </div>

                <div class="member-meta">
                  <div class="member-row">
                    <span class="member-label">Telegram</span>
                    <span class="member-value">${person.telegram || '—'}</span>
                  </div>

                  <div class="member-row">
                    <span class="member-label">Дата старта</span>
                    <span class="member-value">${person.start_date || '—'}</span>
                  </div>

                  <div class="member-row">
                    <span class="member-label">Срок работы</span>
                    <span class="member-value">${person.work_days || '—'} дней</span>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        ${
          hasMore
            ? `
              <div style="display:flex; justify-content:center; margin-top:16px;">
                <button class="modal-btn" type="button" onclick="showMoreStatusMembers()">
                  Показать ещё
                </button>
              </div>
            `
            : ''
        }
      `;

      const inputAfterRender = document.getElementById('memberSearchInput');
      const previousQuery = window.__teamMemberSearchQuery || '';
      if (inputAfterRender) {
        inputAfterRender.value = previousQuery;
      }
    }

    let memberSearchTimer = null;

    function debouncedFilterStatusMembers() {
      clearTimeout(memberSearchTimer);
      memberSearchTimer = setTimeout(() => {
        filterStatusMembers();
      }, 180);
    }

    function filterStatusMembers() {
      const input = document.getElementById('memberSearchInput');
      const q = String(input?.value || '').trim().toLowerCase();

      window.__teamMemberSearchQuery = q;

      if (!q) {
        filteredStatusMembers = [...currentStatusMembers];
        visibleStatusMembersCount = STATUS_MEMBERS_PAGE_SIZE;
        renderStatusMembersList(filteredStatusMembers);
        return;
      }

      filteredStatusMembers = currentStatusMembers.filter(person => {
        const hay = [
          person.name,
          person.telegram,
          person.platform,
          person.start_date,
          person.work_days
        ].join(' ').toLowerCase();

        return hay.includes(q);
      });

      visibleStatusMembersCount = STATUS_MEMBERS_PAGE_SIZE;
      renderStatusMembersList(filteredStatusMembers);
    }

    function showMoreStatusMembers() {
      visibleStatusMembersCount += STATUS_MEMBERS_PAGE_SIZE;
      renderStatusMembersList(filteredStatusMembers);
    }

    async function copyStatusTelegrams() {
      const items = currentStatusMembers
        .map(x => String(x.telegram || '').trim())
        .filter(Boolean);

      if (!items.length) {
        alert('В этом списке нет Telegram для копирования');
        return;
      }

      const text = items.join('\n');

      try {
        await navigator.clipboard.writeText(text);
        alert(`Скопировано Telegram: ${items.length}`);
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert(`Скопировано Telegram: ${items.length}`);
      }
    }

    function closeStatusModal(event) {
      if (event.target.id === 'statusModal') {
        document.getElementById('statusModal').classList.remove('show');
      }
    }

    function forceCloseStatusModal() {
      document.getElementById('statusModal').classList.remove('show');
    }

    window.openStatusMembers = openStatusMembers;
    window.closeStatusModal = closeStatusModal;
    window.forceCloseStatusModal = forceCloseStatusModal;
    window.filterStatusMembers = filterStatusMembers;
    window.copyStatusTelegrams = copyStatusTelegrams;
    window.showMoreStatusMembers = showMoreStatusMembers;

    const TEAM_FIELD_OPTIONS = {
      'Актуальный статус кандидата (Hr)': [
        'Работает',
        'Ожидание старта',
        'Верификация',
        'Ждет тест',
        'Изучает гайд',
        'Хочу взять',
        'Ждет собеседования',
        'Лист ожидания',
        'Уволен',
        'Не рассчитан',
        'Нет ответа',
        'Убрать'
      ],

      'OnlyFans / Fansly': [
        'OnlyFans',
        'Fansly',
        'KM'
      ],

      'Смены (основные)': [
        '00-06',
        '06-12',
        '12-18',
        '18-00'
      ],

      'Верификация (HR)': [
        'Требуется',
        'Написал',
        'Пройдена'
      ],

      'Соглашение (NDA)': [
        'Требуется',
        'Ожидание',
        'Подписано'
      ],

      'Доступы Notion': [
        'Отсутствуют',
        'Гайд OnlyFans',
        'Гайд Fansly',
        'Все доступны OnlyFans',
        'Все доступны Fansly',
        'Все доступны'
      ]
    };

    const TEAM_BOOLEAN_FIELDS = new Set([
      'Transaction ending',
      'Transaction ending (есть/нет в табл.)',
      'Доступы CRM',
      'Доступ к табличке с расписанием OF',
      'Доступ к Telegram чатам OF',
      'Доступ к табличке с расписанием Fansly',
      'Доступ к Telegram чатам Fansly'
    ]);

    function normalizeTeamLabel(label) {
      return String(label || '').trim().replace(/\s+/g, ' ');
    }

    function getTeamFieldOptions(label) {
      const normalized = normalizeTeamLabel(label);
      return TEAM_FIELD_OPTIONS[normalized] || null;
    }

    function isTeamBooleanField(label) {
      const normalized = normalizeTeamLabel(label);
      return TEAM_BOOLEAN_FIELDS.has(normalized);
    }

    function booleanFromCellValue(value) {
      const s = String(value || '').trim().toLowerCase();
      return ['да', 'есть', 'true', '1', 'yes', 'y'].includes(s);
    }

    function booleanToCellValue(checked) {
      return checked ? 'TRUE' : '';
    }

    function getOptionChipClass(fieldLabel, value) {
      const label = normalizeTeamLabel(fieldLabel).toLowerCase();
      const v = String(value || '').trim().toLowerCase();

      if (label === 'актуальный статус кандидата (hr)') {
        if (v.includes('работает') || v.includes('верификация')) return 'chip-green';
        if (v.includes('уволен') || v.includes('не рассчитан') || v.includes('нет ответа') || v.includes('убрать')) return 'chip-red';
        if (v.includes('ожидание') || v.includes('ждет')) return 'chip-yellow';
        if (v.includes('изучает гайд') || v.includes('хочу взять')) return 'chip-blue';
      }

      if (label === 'onlyfans / fansly') {
        if (v.includes('onlyfans')) return 'chip-blue';
        if (v.includes('fansly')) return 'chip-purple';
        return 'chip-yellow';
      }

      if (label === 'верификация (hr)' || label === 'соглашение (nda)') {
        if (v.includes('пройдена') || v.includes('подписано')) return 'chip-green';
        if (v.includes('требуется')) return 'chip-red';
        return 'chip-yellow';
      }

      if (label === 'доступы notion') {
        if (v.includes('отсутств')) return 'chip-red';
        if (v.includes('все доступны')) return 'chip-green';
        return 'chip-yellow';
      }

      if (label === 'смены (основные)') {
        return 'chip-blue';
      }

      return 'chip-neutral';
    }

    function toggleEditorDropdown(event) {
      event.stopPropagation();

      const dropdown = event.currentTarget.closest('.editor-dropdown');
      if (!dropdown) return;

      document.querySelectorAll('.editor-dropdown.open').forEach(el => {
        if (el !== dropdown) el.classList.remove('open');
      });

      dropdown.classList.toggle('open');
    }

    function selectEditorOption(event, fieldIndex, value) {
      event.stopPropagation();

      const dropdown = event.currentTarget.closest('.editor-dropdown');
      if (!dropdown) return;

      const field = currentMemberFields[fieldIndex];
      if (!field) return;

      dropdown.dataset.selectedValue = value;

      const btn = dropdown.querySelector('.editor-dropdown-btn');
      if (btn) {
        btn.innerHTML = `
          <span class="editor-chip ${getOptionChipClass(field.label, value)}">${value}</span>
        `;
      }

      dropdown.querySelectorAll('.editor-option').forEach(opt => {
        opt.classList.remove('active');
      });

      event.currentTarget.classList.add('active');
      dropdown.classList.remove('open');
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.editor-dropdown.open').forEach(el => {
        el.classList.remove('open');
      });
    });

    let currentMemberEditorRow = null;
    let currentMemberFields = [];
    let isCreatingMember = false;

    function isLongField(label) {
      const s = String(label || '').toLowerCase();
      return (
        s.includes('комментар') ||
        s.includes('пометки') ||
        s.includes('причина') ||
        s.includes('ссылка') ||
        s.includes('доступ') ||
        s.includes('логин') ||
        s.includes('пароль')
      );
    }

    async function openMemberEditor(rowNumber) {
      currentMemberEditorRow = rowNumber;

      const overlay = document.getElementById('memberEditorOverlay');
      const title = document.getElementById('memberEditorTitle');
      const content = document.getElementById('memberEditorContent');

      title.textContent = `Карточка сотрудника · строка ${rowNumber}`;
      content.innerHTML = `<div class="loading">Загружаем данные...</div>`;
      overlay.classList.add('show');

      const res = await api(`/api/team-member/${rowNumber}`);
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        content.innerHTML = `<div class="error-box">${data.error || 'Не удалось загрузить сотрудника'}</div>`;
        return;
      }

      currentMemberFields = Array.isArray(data.fields) ? data.fields : [];

      content.innerHTML = `
        <div class="editor-grid">
          ${currentMemberFields.map((field, idx) => {
            const long = isLongField(field.label);
            const options = getTeamFieldOptions(field.label);
            const isBoolean = isTeamBooleanField(field.label);
            const safeValue = String(field.value || '').replace(/"/g, '&quot;');

            return `
              <div class="editor-field ${long ? 'full' : ''}">
                <div class="editor-label">${field.label}</div>
                ${
                  isBoolean
                    ? `
                      <div class="editor-checkbox-wrap">
                        <span class="editor-checkbox-label">Есть доступ</span>
                        <input
                          type="checkbox"
                          class="editor-checkbox"
                          data-field-index="${idx}"
                          data-field-type="boolean"
                          ${booleanFromCellValue(field.value) ? 'checked' : ''}
                        >
                      </div>
                    `
                    : options
                      ? `
                        <div class="editor-dropdown" data-field-index="${idx}" data-field-type="select">
                          <button
                            type="button"
                            class="editor-dropdown-btn"
                            onclick="toggleEditorDropdown(event)"
                          >
                            <span class="editor-chip ${getOptionChipClass(field.label, field.value || '— выбрать —')}">
                              ${field.value || '— выбрать —'}
                            </span>
                          </button>

                          <div class="editor-dropdown-menu">
                            ${options.map(opt => `
                              <div
                                class="editor-option ${String(field.value || '').trim() === String(opt).trim() ? 'active' : ''}"
                                onclick="selectEditorOption(event, ${idx}, '${String(opt).replace(/'/g, "\\'")}')"
                              >
                                <span class="editor-chip ${getOptionChipClass(field.label, opt)}">${opt}</span>
                                <span class="editor-option-check">✓</span>
                              </div>
                            `).join('')}
                          </div>
                        </div>
                      `
                      : long
                        ? `<textarea class="editor-textarea" data-field-index="${idx}" data-field-type="text">${field.value || ''}</textarea>`
                        : `<input class="editor-input" data-field-index="${idx}" data-field-type="text" value="${safeValue}">`
                }
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    async function openNewMemberEditor() {
      isCreatingMember = true;
      currentMemberEditorRow = null;

      const overlay = document.getElementById('memberEditorOverlay');
      const title = document.getElementById('memberEditorTitle');
      const content = document.getElementById('memberEditorContent');

      title.textContent = 'Новый сотрудник';

      const res = await api('/api/team-member/2');
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        content.innerHTML = `<div class="error-box">${data.error || 'Не удалось открыть форму'}</div>`;
        overlay.classList.add('show');
        return;
      }

      currentMemberFields = (Array.isArray(data.fields) ? data.fields : []).map(field => ({
        ...field,
        value: ''
      }));

      content.innerHTML = `
        <div class="editor-grid">
          ${currentMemberFields.map((field, idx) => {
            const long = isLongField(field.label);
            const options = getTeamFieldOptions(field.label);
            const isBoolean = isTeamBooleanField(field.label);

            return `
              <div class="editor-field ${long ? 'full' : ''}">
                <div class="editor-label">${field.label}</div>
                ${
                  isBoolean
                    ? `
                      <div class="editor-checkbox-wrap">
                        <span class="editor-checkbox-label">Есть доступ</span>
                        <input
                          type="checkbox"
                          class="editor-checkbox"
                          data-field-index="${idx}"
                          data-field-type="boolean"
                        >
                      </div>
                    `
                    : options
                      ? `
                        <div class="editor-dropdown" data-field-index="${idx}" data-field-type="select">
                          <button
                            type="button"
                            class="editor-dropdown-btn"
                            onclick="toggleEditorDropdown(event)"
                          >
                            <span class="editor-chip chip-neutral">— выбрать —</span>
                          </button>

                          <div class="editor-dropdown-menu">
                            ${options.map(opt => `
                              <div
                                class="editor-option"
                                onclick="selectEditorOption(event, ${idx}, '${String(opt).replace(/'/g, "\\'")}')"
                              >
                                <span class="editor-chip ${getOptionChipClass(field.label, opt)}">${opt}</span>
                                <span class="editor-option-check">✓</span>
                              </div>
                            `).join('')}
                          </div>
                        </div>
                      `
                      : long
                        ? `<textarea class="editor-textarea" data-field-index="${idx}" data-field-type="text"></textarea>`
                        : `<input class="editor-input" data-field-index="${idx}" data-field-type="text" value="">`
            }
          </div>
        `;
      }).join('')}
        </div>
      `;

      overlay.classList.add('show');
    }

    async function saveMemberEditor() {
      const updates = {};

      document.querySelectorAll('[data-field-index]').forEach(el => {
        const idx = Number(el.dataset.fieldIndex);
        const field = currentMemberFields[idx];
        if (!field) return;

        const fieldType = el.dataset.fieldType || 'text';

        if (fieldType === 'boolean') {
          updates[field.label] = booleanToCellValue(el.checked);
          return;
        }

        if (fieldType === 'select') {
          updates[field.label] = el.dataset.selectedValue || '';
          return;
        }

        updates[field.label] = el.value;
      });

      let res;
      if (isCreatingMember) {
        res = await api('/api/team-member', {
          method: 'POST',
          body: JSON.stringify({ values: updates })
        });
      } else {
        if (!currentMemberEditorRow) return;
        res = await api(`/api/team-member/${currentMemberEditorRow}`, {
          method: 'PATCH',
          body: JSON.stringify({ updates })
        });
      }

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        alert(data.error || 'Не удалось сохранить сотрудника');
        return;
      }

      alert('Сохранено');
      forceCloseMemberEditor();
      isCreatingMember = false;

      if (currentStatusName) {
        await openStatusMembers(currentStatusName);
      }
    }

    function closeMemberEditor(event) {
      if (event.target.id === 'memberEditorOverlay') {
        document.getElementById('memberEditorOverlay').classList.remove('show');
      }
    }

    function forceCloseMemberEditor() {
      document.getElementById('memberEditorOverlay').classList.remove('show');
      isCreatingMember = false;
    }

    document.getElementById('addEmployeeBtn').addEventListener('click', openNewMemberEditor);

    window.openMemberEditor = openMemberEditor;
    window.saveMemberEditor = saveMemberEditor;
    window.closeMemberEditor = closeMemberEditor;
    window.forceCloseMemberEditor = forceCloseMemberEditor;
    window.toggleEditorDropdown = toggleEditorDropdown;
    window.selectEditorOption = selectEditorOption;
    window.debouncedFilterStatusMembers = debouncedFilterStatusMembers;
  </script>
</body>
</html>
